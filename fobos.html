<script>
"use strict";
// ===== 1. CONFIG =====
const FORCE_MOBILE = false;
const CONFIG = {
  W: 320, H: 200, VIEW_H: 168, HORIZ: 84, TIC: 1 / 35, CELL: 64,
  FOV: Math.PI / 2, PROJ: 160, MAX_DIST: 2048, EYE: 41,
  STEP: 24, MIN_GAP: 56, PLAYER_R: 16, ACTOR_R: 20,
  LIGHT_FALLOFF: 96,
  WALK: 8, RUN: 14, STRAFE: 7, STRAFE_RUN: 12, ACCEL: 0.35, FRICTION: 0.82,
  TURN: 0.065, MOUSE: 0.0025,
  DOOR_SPEED: 4, DOOR_WAIT: 150, RISE_SPEED: 2,
  ACID_DMG: 5, ACID_PERIOD: 35
};
const TOUCH = FORCE_MOBILE || (typeof matchMedia === 'function' && matchMedia('(pointer:coarse)').matches);

// ===== 2. UTIL / MATH =====
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rnd = mulberry32(1993);
const rint = n => Math.floor(rnd() * n);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const normAng = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
const rgb = (r, g, b) => (0xFF000000 | ((b & 255) << 16) | ((g & 255) << 8) | (r & 255)) >>> 0;
// Matriz de Bayer 4x4 para tramado ordenado de la luz (elimina bandas)
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => v / 16);

// ===== 3. INPUT =====
const Input = {
  keys: {}, hit: {}, mouseDX: 0, fire: false, wheel: 0, locked: false, ignoreEsc: 0,
  touch: { mx: 0, my: 0, turn: 0, fire: false },
  init(canvas) {
    const block = ['Tab', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
    addEventListener('keydown', e => {
      if (block.includes(e.code)) e.preventDefault();
      if (!this.keys[e.code]) this.hit[e.code] = true;
      this.keys[e.code] = true; Audio.unlock();
    });
    addEventListener('keyup', e => { this.keys[e.code] = false; });
    addEventListener('blur', () => { this.keys = {}; this.fire = false; });
    canvas.addEventListener('mousedown', e => {
      Audio.unlock();
      if (e.button === 0) { this.fire = true; this.hit.Mouse0 = true; }
      if (!TOUCH && Game.state === 'PLAYING' && !this.locked && canvas.requestPointerLock) {
        try { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (err) { /* sin pointer lock */ }
      }
    });
    addEventListener('mouseup', e => { if (e.button === 0) this.fire = false; });
    addEventListener('mousemove', e => { if (this.locked) this.mouseDX += e.movementX; });
    canvas.addEventListener('wheel', e => { this.wheel += Math.sign(e.deltaY); e.preventDefault(); }, { passive: false });
    document.addEventListener('pointerlockchange', () => {
      const was = this.locked; this.locked = document.pointerLockElement === canvas;
      if (was && !this.locked && Game.state === 'PLAYING') { Game.setState('PAUSED'); this.ignoreEsc = performance.now() + 250; }
    });
  },
  pressed(code) { const v = !!this.hit[code]; this.hit[code] = false; return v; },
  consumeMouse() { const v = this.mouseDX; this.mouseDX = 0; return v; },
  endTick() { this.hit = {}; }
};

// Controles táctiles: joystick dinámico (izquierda), arrastre para girar (derecha) y botones
const Touch = {
  init() {
    const root = document.getElementById('touch'); if (!root || !TOUCH) return;
    root.style.display = 'block';
    const stick = document.getElementById('tstick'), knob = document.getElementById('tknob');
    let sId = null, sx = 0, sy = 0, lId = null, lx = 0;
    const first = () => {
      Audio.unlock();
      const d = document.documentElement;
      if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().then(() => { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); }).catch(() => {});
    };
    root.addEventListener('touchstart', e => {
      first();
      for (const c of e.changedTouches) {
        const t = c.target;
        if (t.tagName === 'BUTTON') continue;
        if (Game.state !== 'PLAYING') { Input.hit.Enter = true; Input.hit.Mouse0 = true; continue; }
        if (c.clientX < innerWidth * 0.45 && sId === null) { sId = c.identifier; sx = c.clientX; sy = c.clientY; stick.style.display = 'block'; stick.style.left = (sx - 50) + 'px'; stick.style.top = (sy - 50) + 'px'; knob.style.transform = 'translate(0,0)'; }
        else if (lId === null) { lId = c.identifier; lx = c.clientX; }
      }
      e.preventDefault();
    }, { passive: false });
    root.addEventListener('touchmove', e => {
      for (const c of e.changedTouches) {
        if (c.identifier === sId) {
          const dx = clamp(c.clientX - sx, -50, 50), dy = clamp(c.clientY - sy, -50, 50);
          Input.touch.mx = dx / 50; Input.touch.my = dy / 50; knob.style.transform = `translate(${dx}px,${dy}px)`;
        }
        if (c.identifier === lId) { Input.touch.turn += (c.clientX - lx) * 2.6; lx = c.clientX; }
      }
      e.preventDefault();
    }, { passive: false });
    const end = e => { for (const c of e.changedTouches) { if (c.identifier === sId) { sId = null; Input.touch.mx = Input.touch.my = 0; stick.style.display = 'none'; } if (c.identifier === lId) lId = null; } };
    root.addEventListener('touchend', end); root.addEventListener('touchcancel', end);
    const btn = (id, down, up) => {
      const b = document.getElementById(id);
      b.addEventListener('touchstart', e => { e.preventDefault(); first(); down(); for (const c of e.changedTouches) if (lId === null) { lId = c.identifier; lx = c.clientX; } }, { passive: false });
      b.addEventListener('touchend', e => { e.preventDefault(); if (up) up(); });
    };
    btn('tfire', () => { Input.touch.fire = true; Input.hit.Mouse0 = true; }, () => { Input.touch.fire = false; });
    btn('tuse', () => { Input.hit.KeyE = true; Input.hit.Enter = true; });
    btn('twpn', () => { Input.wheel += 1; });
    btn('tmap', () => { Input.hit.Tab = true; });
    btn('tpause', () => { Input.hit.KeyP = true; });
    const orient = () => { const port = innerHeight > innerWidth; document.getElementById('rotate').style.display = port ? 'flex' : 'none'; if (port && Game.state === 'PLAYING') Game.setState('PAUSED'); };
    addEventListener('resize', orient); orient();
  }
};
const Haptics = { buzz(ms) { if (TOUCH && navigator.vibrate) try { navigator.vibrate(ms); } catch (e) { /* sin vibración */ } } };

// ----- 2b. Fuente bitmap propia 5x7 -----
const FONT = {
  A:[14,17,17,31,17,17,17],B:[30,17,17,30,17,17,30],C:[14,17,16,16,16,17,14],D:[30,17,17,17,17,17,30],
  E:[31,16,16,30,16,16,31],F:[31,16,16,30,16,16,16],G:[14,17,16,23,17,17,15],H:[17,17,17,31,17,17,17],
  I:[14,4,4,4,4,4,14],J:[7,2,2,2,2,18,12],K:[17,18,20,24,20,18,17],L:[16,16,16,16,16,16,31],
  M:[17,27,21,21,17,17,17],N:[17,17,25,21,19,17,17],O:[14,17,17,17,17,17,14],P:[30,17,17,30,16,16,16],
  Q:[14,17,17,17,21,18,13],R:[30,17,17,30,20,18,17],S:[15,16,16,14,1,1,30],T:[31,4,4,4,4,4,4],
  U:[17,17,17,17,17,17,14],V:[17,17,17,17,17,10,4],W:[17,17,17,21,21,21,10],X:[17,17,10,4,10,17,17],
  Y:[17,17,10,4,4,4,4],Z:[31,1,2,4,8,16,31],
  '0':[14,17,19,21,25,17,14],'1':[4,12,4,4,4,4,14],'2':[14,17,1,2,4,8,31],'3':[31,2,4,2,1,17,14],
  '4':[2,6,10,18,31,2,2],'5':[31,16,30,1,1,17,14],'6':[6,8,16,30,17,17,14],'7':[31,1,2,4,8,8,8],
  '8':[14,17,17,14,17,17,14],'9':[14,17,17,15,1,2,12],
  '.':[0,0,0,0,0,12,12],',':[0,0,0,0,12,4,8],':':[0,12,12,0,12,12,0],'!':[4,4,4,4,4,0,4],
  '¡':[4,0,4,4,4,4,4],'?':[14,17,1,2,4,0,4],'¿':[4,0,4,8,16,17,14],'-':[0,0,0,31,0,0,0],
  '—':[0,0,0,31,0,0,0],'/':[1,1,2,4,8,16,16],'%':[24,25,2,4,8,19,3],'(':[2,4,8,8,8,4,2],
  ')':[8,4,2,2,2,4,8],'+':[0,4,4,31,4,4,0],'=':[0,0,31,0,31,0,0],"'":[4,4,8,0,0,0,0],
  '·':[0,0,0,4,0,0,0],'>':[8,4,2,1,2,4,8],'<':[2,4,8,16,8,4,2],' ':[0,0,0,0,0,0,0]
};
const ACCENT = { 'Á': 'A', 'É': 'E', 'Í': 'I', 'Ó': 'O', 'Ú': 'U', 'Ñ': 'N' };

// ===== 5. PALETA + TEXTURAS (todo procedural y original) =====
// 16 rampas x 16 tonos; rampas 12..15 brillan sin depender de la luz (fullbright)
const RAMPS = [
  [[8,8,8],[232,232,232]], [[10,14,22],[175,190,210]], [[22,12,6],[196,146,96]], [[28,0,0],[255,96,72]],
  [[44,16,0],[255,232,120]], [[0,18,4],[130,224,110]], [[44,22,12],[252,204,164]], [[30,10,6],[222,124,82]],
  [[44,26,0],[255,226,110]], [[0,6,32],[120,172,255]], [[14,16,4],[164,172,92]], [[6,6,10],[112,112,132]],
  [[0,44,0],[190,255,130]], [[70,14,0],[255,244,160]], [[110,110,96],[255,255,255]], [[70,0,0],[255,130,110]]
];
const P = (r, t) => (r << 4) | clamp(t | 0, 0, 15);
const PAL = new Uint32Array(256), PAL_RGB = [];
for (let r = 0; r < 16; r++) for (let t = 0; t < 16; t++) {
  const [a, b] = RAMPS[r], k = t / 15, c = [0, 1, 2].map(i => Math.round(a[i] + (b[i] - a[i]) * k));
  PAL_RGB[(r << 4) | t] = c; PAL[(r << 4) | t] = rgb(c[0], c[1], c[2]);
}
// SHADE[L*256+i]: 32 niveles de luz; con luz baja el color tiende al tono de niebla del nivel
const SHADE = new Uint32Array(32 * 256);
function rebuildShade(fog) {
  fog = fog || [0, 0, 0];
  for (let L = 0; L < 32; L++) for (let i = 0; i < 256; i++) {
    const [r, g, b] = PAL_RGB[i];
    if ((i >> 4) >= 12) { SHADE[L * 256 + i] = PAL[i]; continue; }
    const f = (L + 1) / 32, warm = (1 - f) * 0.08, k = (1 - f) * 0.9;
    SHADE[L * 256 + i] = rgb(Math.min(255, r * f * (1 + warm) + fog[0] * k), Math.min(255, g * f + fog[1] * k), Math.min(255, b * f * (1 - warm) + fog[2] * k));
  }
}
rebuildShade();

class Img {
  constructor(w, h, fill = 0) { this.w = w; this.h = h; this.d = new Uint8Array(w * h).fill(fill); }
  px(x, y, c) { x |= 0; y |= 0; if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.d[y * this.w + x] = c; }
  at(x, y) { return (x >= 0 && y >= 0 && x < this.w && y < this.h) ? this.d[y * this.w + x] : 0; }
  rect(x, y, w, h, c) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) this.px(i, j, typeof c === 'function' ? c(i, j) : c); }
  ell(cx, cy, rx, ry, c) { for (let j = -ry; j <= ry; j++) for (let i = -rx; i <= rx; i++) if ((i * i) / (rx * rx + .01) + (j * j) / (ry * ry + .01) <= 1) this.px(cx + i, cy + j, typeof c === 'function' ? c(i, j) : c); }
  line(x0, y0, x1, y1, c, th = 1) {
    const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
    for (let s = 0; s <= n; s++) { const x = x0 + (x1 - x0) * s / n, y = y0 + (y1 - y0) * s / n; this.rect(Math.round(x - (th - 1) / 2), Math.round(y - (th - 1) / 2), th, th, c); }
  }
  clone() { const o = new Img(this.w, this.h); o.d.set(this.d); return o; }
  outline(c) {
    const s = this.d.slice();
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) if (!s[y * this.w + x]) {
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) { const X = x + dx, Y = y + dy; if (X >= 0 && Y >= 0 && X < this.w && Y < this.h && s[Y * this.w + X]) { this.d[y * this.w + x] = c; break; } }
    }
    return this;
  }
  // Volumen: borde iluminado arriba-izquierda, tramado oscuro a la derecha (cap. 09 §6)
  shade() {
    const s = this.d.slice(), w = this.w, h = this.h;
    let x0 = w, x1 = 0; for (let i = 0; i < s.length; i++) if (s[i] > 1) { x0 = Math.min(x0, i % w); x1 = Math.max(x1, i % w); }
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const c = s[y * w + x]; if (c <= 1 || (c >> 4) >= 12) continue;
      const t = c & 15, rel = (x - x0) / Math.max(1, x1 - x0);
      let d = 0;
      if (!(s[y * w + x - 1] > 1) || !(y > 0 && s[(y - 1) * w + x] > 1)) d += 2;       // borde iluminado
      if (rel > 0.66 && ((x + y) & 1)) d -= 2; else if (rel > 0.5 && !((x + y) & 3)) d -= 1; // tramado de sombra
      if (rel < 0.3) d += 1;
      if (d) this.d[y * w + x] = (c & 0xF0) | clamp(t + d, 1, 15);
    }
    return this;
  }
}
function valueNoise(seed, period) {
  const r = mulberry32(seed), N = period, g = new Float32Array(N * N).map(() => r());
  return (x, y) => {
    const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0;
    const at = (i, j) => g[((j % N + N) % N) * N + ((i % N + N) % N)];
    const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    const a = at(x0, y0) + (at(x0 + 1, y0) - at(x0, y0)) * sx, b = at(x0, y0 + 1) + (at(x0 + 1, y0 + 1) - at(x0, y0 + 1)) * sx;
    return a + (b - a) * sy;
  };
}

const Tex = {
  t: {}, sec: {},
  get(id) { const v = this.t[id]; return Array.isArray(v) ? v[(Game.tics >> 3) % v.length] : v; },
  secret(id) { // variante casi idéntica para muros secretos: un remache desplazado y una junta más oscura
    if (!this.sec[id]) { const b = this.t[id], s = (Array.isArray(b) ? b[0] : b).clone(); s.rect(31, 0, 1, s.h, (x, y) => (s.at(x, y) & 0xF0) | clamp((s.at(x, y) & 15) - 3, 1, 15)); s.rect(25, 5, 2, 2, P(14, 6)); this.sec[id] = s; }
    return this.sec[id];
  },
  build() {
    const R = mulberry32(42), n = a => (R() * 2 - 1) * a, T = this.t;
    const base = (w, h, ramp, tone, amp) => { const i = new Img(w, h); i.rect(0, 0, w, h, () => P(ramp, tone + n(amp))); return i; };
    const tech = () => {
      const i = base(64, 64, 1, 7, 1.2);
      for (const py of [0, 32]) for (const px of [0, 32]) {
        i.rect(px, py, 32, 1, P(1, 11)); i.rect(px, py, 1, 32, P(1, 10)); i.rect(px, py + 31, 32, 1, P(1, 3)); i.rect(px + 31, py, 1, 32, P(1, 3));
        for (const [rx, ry] of [[3,3],[27,3],[3,27],[27,27]]) { i.rect(px + rx, py + ry, 2, 2, P(1, 12)); i.px(px + rx + 2, py + ry + 2, P(1, 2)); }
      }
      i.rect(0, 40, 64, 2, P(1, 2)); i.rect(0, 42, 64, 1, P(1, 9)); return i;
    };
    T.WALL_TECH = tech();
    const br = new Img(64, 64); br.rect(0, 0, 64, 64, (x, y) => { const off = ((y >> 3) & 1) * 8; return ((x + off) & 15) === 0 || (y & 7) === 0 ? P(2, 2) : P(2, 7 + n(1.5) + ((x + off) >> 4 & 1)); }); T.WALL_BROWN = br;
    const red = base(64, 64, 3, 5, 1); red.rect(0, 0, 64, 1, P(3, 9)); red.rect(0, 31, 64, 1, P(3, 2)); red.rect(0, 48, 64, 16, (x, y) => (((x + y) >> 3) & 1) ? P(4, 13) : P(0, 2)); T.WALL_RED = red;
    const pil = new Img(64, 64); pil.rect(0, 0, 64, 64, (x, y) => (y & 15) < 2 ? P(1, 3) : P(1, 4 + 8 * Math.sin(Math.PI * x / 64) + n(0.6))); T.WALL_PILLAR = pil;
    T.WALL_COMPUTER = [0, 1].map(f => {
      const i = base(64, 64, 0, 5, 0.8), r2 = mulberry32(7 + f);
      for (const sx of [4, 36]) { i.rect(sx - 1, 7, 26, 18, P(0, 2)); i.rect(sx, 8, 24, 16, P(12, 1)); for (let y = 10; y < 23; y += 2) i.rect(sx + 1, y, 4 + Math.floor(r2() * 18), 1, P(12, 8 + Math.floor(r2() * 6))); }
      i.rect(4, 32, 56, 20, P(0, 3)); for (let k = 0; k < 8; k++) i.rect(7 + k * 6, 36 + (k & 1) * 6, 3, 3, (k + f) % 3 ? P(15, 10) : P(12, 12)); i.rect(0, 60, 64, 4, P(0, 2)); return i;
    });
    const nz = valueNoise(3, 16);
    T.WALL_ROCK = new Img(64, 64); T.WALL_ROCK.rect(0, 0, 64, 64, (x, y) => P(7, 3 + 8 * (nz(x / 8, y / 8) * 0.7 + nz(x / 3, y / 3) * 0.3) + n(0.7)));
    const step = base(64, 64, 11, 6, 0.8); step.rect(0, 0, 64, 4, (x) => ((x >> 2) & 1) ? P(4, 12) : P(0, 2)); T.WALL_STEP = step;
    const ms = base(64, 64, 11, 5, 0.8); for (let x = 4; x < 64; x += 16) for (let y = 4; y < 64; y += 16) ms.rect(x, y, 2, 2, P(11, 11)); ms.rect(0, 0, 64, 2, P(11, 10)); T.WALL_METAL = ms;
    // Tuberías
    const pipes = base(64, 64, 11, 3, 0.6);
    for (const [px, w, r] of [[4, 12, 1], [22, 8, 9], [36, 14, 1], [54, 7, 11]]) {
      pipes.rect(px, 0, w, 64, (x) => P(r, 3 + 8 * Math.sin(Math.PI * (x - px + 0.5) / w) + (x - px < w * 0.3 ? 2 : 0)));

  zones: [['Z9p', 24, 27, 23, 23], ['Z1', 2, 22, 21, 34], ['Z2', 2, 9, 13, 20], ['Z3', 13, 22, 9, 20], ['Z4', 24, 40, 4, 16], ['Z5', 41, 46, 9, 11],

  light: { Z1: 192, Z2: 160, Z3: 144, Z4: 176, Z5: 144, Z6: 176, Z7: 176, Z8: 208, Z9: 224, Z9p: 96 },
  wall: { Z6: 'WALL_BROWN', Z7: 'WALL_BROWN', Z8: 'WALL_RED', Z9: 'WALL_ROCK' }, floor: { Z8: 'FLOOR_DARK' },

for (let k = 2; k <= 6; k++) LEVELS.push(Object.assign({ step: () => 0 }, LEVEL_DATA[k]));
LEVELS.forEach((L, k) => { L.id = k + 1; L.music = k; });

const MW = 64, MH = 36;
const SOLID_CH = '#OCSwv', DOOR_CH = 'DXFRAYBbTtL';
const KEY_OF = { R: 'red', A: 'blue', Y: 'yellow' };
const KEY_NAME = { red: 'roja', blue: 'azul', yellow: 'amarilla' };
function zoneOf(def, x, y) { for (const [n, x0, x1, y0, y1] of def.zones) if (x >= x0 && x <= x1 && y >= y0 && y <= y1) return n; return '-'; }

const Level = {
  N: MW * MH, def: LEVELS[0], num: 0,
  load(k = this.num) {
    this.num = k; const L = this.def = LEVELS[k]; rebuildShade(L.fog);
    const n = this.N;
    this.ch = new Array(n); this.floor = new Float32Array(n); this.ceil = new Float32Array(n);
    this.light = new Uint8Array(n); this.lightCur = new Uint8Array(n); this.dyn = new Float32Array(n);
    this.solid = new Uint8Array(n); this.sky = new Uint8Array(n); this.acid = new Uint8Array(n); this.flicker = new Uint8Array(n); this.block = new Uint8Array(n);
    this.seen = new Uint8Array(n); this.zone = new Array(n);
    this.wallTex = new Array(n); this.floorTex = new Array(n); this.ceilTex = new Array(n); this.upTex = new Array(n); this.lowTex = new Array(n); this.solidTex = new Array(n);
    this.doors = []; this.doorAt = new Array(n).fill(null); this.rising = []; this.fired = new Set(); this.flickOn = false;
    for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
      const i = y * MW + x, c = L.rows[y][x], z = zoneOf(L, x, y);
      this.ch[i] = c; this.zone[i] = z; this.light[i] = L.light[z] ?? 160;
      this.wallTex[i] = L.wall[z] || 'WALL_TECH';
      this.floor[i] = 0; this.ceil[i] = 128; this.floorTex[i] = 'FLOOR_GRATE';
      this.ceilTex[i] = (x + y) % 3 === 0 ? 'CEIL_LIGHT' : 'CEIL_TECH';  // V2: paneles de luz cada 3 celdas
      if (SOLID_CH.includes(c)) { this.solid[i] = 1; this.solidTex[i] = { O: 'WALL_PILLAR', C: 'WALL_COMPUTER', S: 'SWITCH_OFF', w: 'WSWITCH_OFF', v: 'WSWITCH_OFF' }[c] || null; continue; }
      switch (c) {
        case '_': this.floor[i] = -16; this.floorTex[i] = 'FLOOR_BLUE'; break;
        case '^': this.floor[i] = 32; this.floorTex[i] = 'FLOOR_CRATE'; this.ceilTex[i] = 'CEIL_TECH'; this.lowTex[i] = 'WALL_STEP'; break;
        case 'e': this.floor[i] = L.step(x, y, z); this.floorTex[i] = 'FLOOR_STEP'; this.lowTex[i] = 'WALL_STEP'; break;
        case '=': this.floor[i] = -16; this.ceil[i] = 160; this.floorTex[i] = 'FLOOR_METAL'; this.lowTex[i] = 'WALL_METAL'; break;
        case '~': this.floor[i] = -40; this.ceil[i] = 160; this.floorTex[i] = 'FLOOR_ACID'; this.acid[i] = 1; break;
        case ';': this.floor[i] = -8; this.floorTex[i] = 'FLOOR_ACID'; this.acid[i] = 1; break;
        case 'k': this.floor[i] = 40; this.ceil[i] = 160; this.floorTex[i] = 'FLOOR_METAL'; this.lowTex[i] = 'WALL_METAL'; this.light[i] = 200; break;
        case ',': this.ceil[i] = 112; this.floorTex[i] = 'FLOOR_DARK'; this.ceilTex[i] = 'CEIL_DARK'; this.flicker[i] = 1; break;
        case '"': this.floor[i] = -8; this.ceil[i] = 256; this.sky[i] = 1; this.floorTex[i] = 'FLOOR_ROCK'; break;
        case 'u': this.floor[i] = 48; this.ceil[i] = 176; this.lowTex[i] = 'WALL_METAL'; break;
        case '1': case '2': case '3': case '4': this.floor[i] = (+c) * 12; this.ceil[i] = 176; this.floorTex[i] = 'FLOOR_STEP'; this.lowTex[i] = 'WALL_STEP'; break;
        case 'm': case 'n': case 'o': case 'p':
          this.ceil[i] = 176; this.floorTex[i] = 'FLOOR_STEP'; this.lowTex[i] = 'WALL_STEP';
          this.rising.push({ i, to: { m: 12, n: 24, o: 36, p: 48 }[c], group: 'stairs', on: false }); break;
        case 'z': this.floor[i] = -40; this.ceil[i] = 176; this.floorTex[i] = 'FLOOR_METAL'; this.lowTex[i] = 'WALL_METAL'; this.block[i] = 1;
          this.rising.push({ i, to: L.zTo, group: 'bridge', on: false }); break;
      }
      if (L.floor[z] && (c === '.' || c === 'u' || c === '^')) this.floorTex[i] = L.floor[z];
      if (L.flicker.includes(z)) this.flicker[i] = 1;
      if (L.sky.includes(z)) { this.sky[i] = 1; this.ceil[i] = 256; }
      if (DOOR_CH.includes(c)) {
        const d = { x, y, i, type: c, h: 0, max: 128, state: 'closed', wait: 0, once: 'FBbTt'.includes(c), locked: 0, stay: false };
        this.doors.push(d); this.doorAt[i] = d;

        if (c === 'F' || c === 'T' || c === 't') { const sk = 'SECRET_' + wt; if (!Tex.t[sk]) Tex.t[sk] = c === 'F' ? Tex.secret(wt) : Tex.get(wt); this.upTex[i] = sk; }
        else this.upTex[i] = { D: 'DOOR_METAL', X: 'DOOR_EXIT', R: 'DOOR_RED', A: 'DOOR_BLUE', Y: 'DOOR_YELLOW', B: 'DOOR_BARRIER', b: 'DOOR_BARRIER', L: 'DOOR_LOCK' }[c];

      if (fl < -1e8) fl = 0;

      this.ceil[d.i] = fl + d.h;

  },
  idx(x, y) { return y * MW + x; },
  at(wx, wy) { const x = Math.floor(wx / 64), y = Math.floor(wy / 64); return (x < 0 || y < 0 || x >= MW || y >= MH) ? -1 : y * MW + x; },
  addLight(wx, wy, amt, rad) {
    const cx = Math.floor(wx / 64), cy = Math.floor(wy / 64);
    for (let y = cy - rad; y <= cy + rad; y++) for (let x = cx - rad; x <= cx + rad; x++) {
      if (x < 0 || y < 0 || x >= MW || y >= MH) continue;
      const d = Math.hypot(x - cx, y - cy); if (d > rad + 0.5) continue; const i = y * MW + x; this.dyn[i] = Math.min(160, this.dyn[i] + amt * (1 - d / (rad + 1)));

  },
  // Disparadores del nivel: 'enter' (zona), 'pick' (objeto), 'w'/'v' (interruptores)
  fire(on, arg) {
    for (const t of this.def.trig) {
      if (this.fired.has(t)) continue;
      if (t.on !== on) continue;
      if (on === 'pick' && t.item !== arg) continue;
      if (on === 'enter') { const [x0, y0, x1, y1] = t.rect, x = arg % MW, y = Math.floor(arg / MW); if (x < x0 || x > x1 || y < y0 || y > y1) continue; }
      this.fired.add(t);
      for (const a of t.do) this.act(a);
    }
  },
  act(a) {
    const [op, p1, p2] = a;
    if (op === 'open') {
      for (const d of this.doors) if (d.type === p1 && d.state === 'closed') {
        d.state = 'opening'; d.once = true; Audio.sfx('door', d.x * 64 + 32, d.y * 64 + 32);
        for (const e of Actors.list) if (e.enemy && e.hp > 0 && Math.hypot(e.x - (d.x * 64 + 32), e.y - (d.y * 64 + 32)) < 6 * 64) AI.wake(e, Player);
      }
      if (p1 === 'T' || p1 === 't') HUD.msg('¡Una trampa!');
    } else if (op === 'raise') {
      let any = false; for (const r of this.rising) if (r.group === p1 && !r.on) { r.on = true; this.block[r.i] = 0; any = true; }
      if (any) { Audio.sfx('rise'); HUD.msg(p1 === 'bridge' ? 'Un puente se eleva.' : 'Una escalera se eleva.'); }
    } else if (op === 'dark') {
      for (let i = 0; i < this.N; i++) if (this.zone[i] === p1) this.light[i] = 40;
      HUD.msg('Las luces se apagan...'); Audio.sfx('dark');
    } else if (op === 'lock') {
      for (const d of this.doors) if (d.type === p1) { d.locked = p2; d.stay = false; d.state = 'closing'; }
      HUD.msg('¡Las puertas se cierran! 30 s'); Audio.sfx('doorclose');
    }
  },
  tick() {
    if (rnd() < 0.1) this.flickOn = !this.flickOn;
    const fv = this.flickOn ? 176 : 64, D = this.dyn, Lb = this.light, F = this.flicker, C = this.lightCur;

    for (const r of this.rising) if (r.on && this.floor[r.i] !== r.to) { const f = this.floor[r.i]; this.floor[r.i] = f < r.to ? Math.min(r.to, f + CONFIG.RISE_SPEED) : Math.max(r.to, f - CONFIG.RISE_SPEED); }
  }
};

// ===== 8. RENDER 3D (raycasting DDA con alturas por celda, tramado de luz) =====
const MAX_OCC = 64;
const Render = {
  init(ctx) {
    this.ctx = ctx; this.img = ctx.createImageData(CONFIG.W, CONFIG.H); this.buf = new Uint32Array(this.img.data.buffer);
    this.depth = new Float32Array(320); this.occN = new Int32Array(320);
    this.occD = new Float32Array(320 * MAX_OCC); this.occT = new Int16Array(320 * MAX_OCC); this.occB = new Int16Array(320 * MAX_OCC);
    this.colAng = new Float32Array(320); this.colCos = new Float32Array(320);
    for (let x = 0; x < 320; x++) { const a = Math.atan((x + 0.5 - 160) / CONFIG.PROJ); this.colAng[x] = a; this.colCos[x] = Math.cos(a); }
  },
  lightF(light, d, extra) { return (light >> 3) - d / CONFIG.LIGHT_FALLOFF + extra; },
  lightLevel(light, d, extra) { const L = this.lightF(light, d, extra); return L < 0 ? 0 : L > 31 ? 31 : L | 0; },
  view(px, py, ang, eyeZ, extra) {
    const B = this.buf, LV = Level, PROJ = CONFIG.PROJ, HZ = CONFIG.HORIZ, VH = CONFIG.VIEW_H, sky = Tex.t.SKY;
    this.px = px; this.py = py; this.ang = ang; this.eyeZ = eyeZ; this.extra = extra;
    const dith = (Lf, x, y) => { const v = (Lf + BAYER[(x & 3) | ((y & 3) << 2)]) | 0; return v < 0 ? 0 : v > 31 ? 31 : v; };
    for (let x = 0; x < 320; x++) {
      const ra = ang + this.colAng[x], dx = Math.cos(ra), dy = Math.sin(ra), cc = this.colCos[x];
      let mx = Math.floor(px / 64), my = Math.floor(py / 64);
      const ddx = dx === 0 ? 1e30 : Math.abs(64 / dx), ddy = dy === 0 ? 1e30 : Math.abs(64 / dy), sx = dx < 0 ? -1 : 1, sy = dy < 0 ? -1 : 1;
      let sideX = dx < 0 ? (px - mx * 64) / 64 * ddx : ((mx + 1) * 64 - px) / 64 * ddx;
      let sideY = dy < 0 ? (py - my * 64) / 64 * ddy : ((my + 1) * 64 - py) / 64 * ddy;
      let prev = my * MW + mx, top = 0, bot = VH - 1, nOcc = 0, side = 0, t = 0;
      const skyU = ((Math.floor(ra / (2 * Math.PI) * 1024) % 256) + 256) % 256;
      this.depth[x] = CONFIG.MAX_DIST; LV.seen[prev] = 1;
      for (let guard = 0; guard < 200; guard++) {
        if (sideX < sideY) { t = sideX; sideX += ddx; mx += sx; side = 0; } else { t = sideY; sideY += ddy; my += sy; side = 1; }
        const perp = Math.max(t * cc, 0.5), pf = LV.floor[prev], pc = LV.ceil[prev], pl = LV.lightCur[prev];
        if (pf < eyeZ) {
          const yF = HZ + (eyeZ - pf) * PROJ / perp; let s = Math.ceil(yF - 0.5); if (s < top) s = top;
          if (s <= bot) {
            const td = Tex.get(LV.floorTex[prev]).d, acid = LV.acid[prev], shift = acid ? Game.tics * 0.5 : 0;
            const wob = acid ? 1 : 0, lb = pl >> 3, ex2 = extra;
            for (let y = s; y <= bot; y++) {
              const rp = (eyeZ - pf) * PROJ / (y + 0.5 - HZ), e = rp / cc;
              const wx = px + dx * e + shift, wy = py + dy * e;
              const u = ((wx + (wob ? Math.sin(wy * 0.09 + Game.tics * 0.15) * 3 : 0)) & 63), v = (wy & 63);
              const L = acid ? 31 : dith(lb - rp / CONFIG.LIGHT_FALLOFF + ex2, x, y);
              B[y * 320 + x] = SHADE[(L << 8) | td[(v << 6) | u]];
            }
            bot = s - 1;
          }
        }
        if (LV.sky[prev]) {
          const yC = HZ - (pc - eyeZ) * PROJ / perp; let e = Math.floor(yC - 0.5); if (e > bot) e = bot;
          for (let y = top; y <= e; y++) B[y * 320 + x] = PAL[sky.d[(y < 99 ? y : 99) * 256 + skyU]];
          if (e + 1 > top) top = e + 1;
        } else if (pc > eyeZ) {
          const yC = HZ - (pc - eyeZ) * PROJ / perp; let e = Math.floor(yC - 0.5); if (e > bot) e = bot;
          if (e >= top) {
            const td = Tex.get(LV.ceilTex[prev]).d, lb = pl >> 3;
            for (let y = top; y <= e; y++) {
              const rp = (pc - eyeZ) * PROJ / (HZ - y - 0.5), ee = rp / cc;
              const u = ((px + dx * ee) & 63), v = ((py + dy * ee) & 63);
              B[y * 320 + x] = SHADE[(dith(lb - rp / CONFIG.LIGHT_FALLOFF + extra, x, y) << 8) | td[(v << 6) | u]];
            }
            top = e + 1;
          }
        }
        if (top > bot || t > CONFIG.MAX_DIST || mx < 0 || my < 0 || mx >= MW || my >= MH) { this.depth[x] = perp; break; }
        const N = my * MW + mx; LV.seen[N] = 1;
        let u = side === 0 ? (py + dy * t) : (px + dx * t); u = Math.floor(u) & 63;
        if ((side === 0 && dx < 0) || (side === 1 && dy > 0)) u = 63 - u;
        const Lw = this.lightF(pl, perp, extra - side);
        if (LV.solid[N]) {
          const tex = Tex.get(LV.solidTex[N] || LV.wallTex[prev]), th = tex.h, td = tex.d;
          for (let y = top; y <= bot; y++) {
            const z = eyeZ - (y + 0.5 - HZ) * perp / PROJ, v = th - 1 - (((Math.floor(z - pf) % th) + th) % th);
            B[y * 320 + x] = SHADE[(dith(Lw, x, y) << 8) | td[v * 64 + u]];
          }
          this.depth[x] = perp; break;
        }
        const nf = LV.floor[N], nc = LV.ceil[N];
        if (nc < pc && !(LV.sky[N] && LV.sky[prev])) {
          const yU = HZ - (nc - eyeZ) * PROJ / perp; let e = Math.floor(yU - 0.5); if (e > bot) e = bot;
          if (e >= top) {
            const door = LV.doorAt[N], tex = Tex.get(door ? LV.upTex[N] : LV.wallTex[prev]), th = tex.h, td = tex.d;
            for (let y = top; y <= e; y++) {
              const z = eyeZ - (y + 0.5 - HZ) * perp / PROJ;
              const v = door ? th - 1 - (((Math.floor(z - nc) % th) + th) % th) : (((Math.floor(pc - z) % th) + th) % th);

            }

          }
        }
        if (nf > pf) {
          const yL = HZ - (nf - eyeZ) * PROJ / perp; let s = Math.ceil(yL - 0.5); if (s < top) s = top;
          if (s <= bot) {
            const tex = Tex.get(LV.lowTex[N] || LV.wallTex[prev]), th = tex.h, td = tex.d;
            for (let y = s; y <= bot; y++) { const z = eyeZ - (y + 0.5 - HZ) * perp / PROJ, v = ((Math.floor(nf - z) % th) + th) % th; B[y * 320 + x] = SHADE[(dith(Lw, x, y) << 8) | td[v * 64 + u]]; }
            bot = s - 1;
          }
        }
        if (nOcc < MAX_OCC) { const o = x * MAX_OCC + nOcc++; this.occD[o] = perp; this.occT[o] = top; this.occB[o] = bot; }
        if (top > bot) { this.depth[x] = perp; break; }
        prev = N;
      }
      this.occN[x] = nOcc;
    }
  },
  clipAt(x, tz) { let ct = 0, cb = CONFIG.VIEW_H - 1; const n = this.occN[x], base = x * MAX_OCC; for (let k = 0; k < n; k++) { if (this.occD[base + k] >= tz) break; ct = this.occT[base + k]; cb = this.occB[base + k]; } return [ct, cb]; },
  sprites(list) {
    const B = this.buf, PROJ = CONFIG.PROJ, HZ = CONFIG.HORIZ, ca = Math.cos(this.ang), sa = Math.sin(this.ang), vis = [];
    for (const a of list) {
      const img = a.sprite && a.sprite(); if (!img) continue;
      const rx = a.x - this.px, ry = a.y - this.py, tz = rx * ca + ry * sa;
      if (tz < 4 || tz > CONFIG.MAX_DIST) continue;
      vis.push({ a, img, tz, tx: -rx * sa + ry * ca });
    }
    vis.sort((p, q) => q.tz - p.tz);
    const white = SHADE[(31 << 8) | P(14, 15)];
    for (const { a, img, tz, tx } of vis) {
      const sc = PROJ / tz, w = img.w * sc, h = img.h * sc, left = 160 + tx * sc - w / 2;
      const bottom = HZ - ((a.z + (a.zoff || 0)) - this.eyeZ) * sc, topY = bottom - h;
      const cell = Level.at(a.x, a.y), L = a.fullbright ? 31 : this.lightLevel(cell >= 0 ? Level.lightCur[cell] : 160, tz, this.extra);
      const flip = a.flip && a.flip(), fuzz = a.type === 'ESPECTRO' && a.hp > 0, flash = a.hitT > 0;
      const x0 = Math.max(0, Math.ceil(left - 0.5)), x1 = Math.min(319, Math.floor(left + w - 0.5));
      for (let x = x0; x <= x1; x++) {
        if (tz >= this.depth[x]) continue;
        const [ct, cb] = this.clipAt(x, tz);
        let tx2 = Math.floor((x + 0.5 - left) / sc); if (tx2 < 0 || tx2 >= img.w) continue; if (flip) tx2 = img.w - 1 - tx2;
        const y0 = Math.max(ct, Math.ceil(topY - 0.5)), y1 = Math.min(cb, Math.floor(bottom - 0.5));
        for (let y = y0; y <= y1; y++) {
          const ty = Math.floor((y + 0.5 - topY) / sc); if (ty < 0 || ty >= img.h) continue;
          const c = img.d[ty * img.w + tx2]; if (!c) continue;
          const o = y * 320 + x;
          if (fuzz) { // Espectro: distorsión semitransparente (oscurece y desplaza el fondo)
            const src = B[o + ((((x * 7 + y * 3 + Game.tics) >> 1) & 3) - 1) * 320] || B[o];
            B[o] = ((src >> 1) & 0x7F7F7F) | ((x + y + Game.tics) & 3 ? 0xFF000000 : (0xFF000000 | ((src >> 2) & 0x3F3F3F)));
            if (!((x * 13 + y * 7 + Game.tics) % 11)) B[o] = SHADE[(Math.max(0, L - 8) << 8) | c];

      }

  },
  blit(img, x, y, L = 31, maxY = CONFIG.H, scale = 1) {
    const B = this.buf;
    for (let j = 0; j < img.h * scale; j++) {
      const Y = (y + j) | 0; if (Y < 0 || Y >= maxY) continue;

    }
  },
  fill(x, y, w, h, col) { for (let j = Math.max(0, y); j < Math.min(200, y + h); j++) for (let i = Math.max(0, x); i < Math.min(320, x + w); i++) this.buf[j * 320 + i] = col; },
  tint(r, g, b, a, h = CONFIG.VIEW_H) { if (a <= 0) return; const B = this.buf, ia = 1 - a; for (let i = 0; i < 320 * h; i++) { const c = B[i]; B[i] = rgb((c & 255) * ia + r * a, ((c >> 8) & 255) * ia + g * a, ((c >> 16) & 255) * ia + b * a); } },
  text(str, x, y, col, scale = 1, shadow = true) {
    str = String(str).toUpperCase(); let cx = x;
    for (const ch of str) {
      const g = FONT[ACCENT[ch] || ch] || FONT['?'];
      for (let pass = shadow ? 0 : 1; pass < 2; pass++) {
        const o = pass === 0 ? scale : 0, c = pass === 0 ? 0xFF000000 : col;

        if (ACCENT[ch]) { if (ch === 'Ñ') this.fill(cx + scale + o, y - 2 * scale + o, 3 * scale, scale, c); else { this.fill(cx + 3 * scale + o, y - 2 * scale + o, scale, scale, c); this.fill(cx + 2 * scale + o, y - scale + o, scale, scale, c); } }

  },
  textW(str, scale = 1) { return String(str).length * 6 * scale; },
  center(str, y, col, scale = 1) { this.text(str, Math.round(160 - this.textW(str, scale) / 2), y, col, scale); },
  present() { this.ctx.putImageData(this.img, 0, 0); }
};

// Partículas 3D con profundidad: chispas, sangre con gravedad, humo, casquillos
const Particles = {
  list: [],
  reset() { this.list = []; },
  burst(kind, x, y, z, n, ang) {
    for (let k = 0; k < n && this.list.length < 400; k++) {
      const a = (ang ?? rnd() * Math.PI * 2) + (rnd() - 0.5) * (ang === undefined ? 6.3 : 1.6), sp = { spark: 3, blood: 2, smoke: 0.4, casing: 2.2, debris: 4 }[kind] * (0.5 + rnd());
      this.list.push({ kind, x, y, z, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, vz: { spark: 2 + rnd() * 3, blood: 1 + rnd() * 3, smoke: 0.6 + rnd() * 0.5, casing: 3 + rnd() * 2, debris: 3 + rnd() * 4 }[kind], life: { spark: 10, blood: 24, smoke: 40, casing: 30, debris: 30 }[kind] + rint(10), t: 0 });
    }
  },
  tick() {
    for (const p of this.list) {
      p.t++; p.x += p.vx; p.y += p.vy; p.z += p.vz;
      if (p.kind === 'smoke') { p.vx *= 0.95; p.vy *= 0.95; } else p.vz -= 0.5;
      const i = Level.at(p.x, p.y), f = i >= 0 ? Level.floor[i] : 0;
      if (i < 0 || Level.solid[i]) { p.vx = p.vy = 0; p.t = p.life; }
      if (p.z < f) { p.z = f; p.vz = -p.vz * 0.3; p.vx *= 0.5; p.vy *= 0.5; }
    }
    this.list = this.list.filter(p => p.t < p.life);
  },
  draw() {
    const R = Render, B = R.buf, ca = Math.cos(R.ang), sa = Math.sin(R.ang);
    for (const p of this.list) {
      const rx = p.x - R.px, ry = p.y - R.py, tz = rx * ca + ry * sa; if (tz < 4) continue;
      const tx = -rx * sa + ry * ca, sx = Math.round(160 + tx * CONFIG.PROJ / tz), sy = Math.round(CONFIG.HORIZ - (p.z - R.eyeZ) * CONFIG.PROJ / tz);
      const sz = Math.max(1, Math.round((p.kind === 'smoke' ? 10 + p.t * 0.6 : 2) * CONFIG.PROJ / tz / 8));
      const k = p.t / p.life;
      const col = p.kind === 'spark' ? PAL[P(13, 15 - k * 8)] : p.kind === 'blood' ? PAL[P(3, 9 - k * 4)] : p.kind === 'casing' ? PAL[P(8, 12)] : p.kind === 'debris' ? PAL[P(0, 6)] : 0;
      for (let j = 0; j < sz; j++) for (let i = 0; i < sz; i++) {
        const X = sx + i - (sz >> 1), Y = sy + j - (sz >> 1);
        if (X < 0 || X >= 320 || Y < 0 || Y >= CONFIG.VIEW_H || tz >= R.depth[X]) continue;
        const [ct, cb] = R.clipAt(X, tz); if (Y < ct || Y > cb) continue;
        const o = Y * 320 + X;
        if (p.kind === 'smoke') { if ((X + Y + p.t) & 1) { const c = B[o], a = 0.35 * (1 - k); B[o] = rgb((c & 255) * (1 - a) + 120 * a, ((c >> 8) & 255) * (1 - a) + 120 * a, ((c >> 16) & 255) * (1 - a) + 125 * a); } }
        else B[o] = col;
      }
    }
  }
};

// ===== 9. ENTIDADES (física, jugador, actores, objetos, proyectiles) =====
// ----- 9a. Física compartida -----
const Phys = {
  corners(x, y, r) { return [Level.at(x - r, y - r), Level.at(x + r, y - r), Level.at(x - r, y + r), Level.at(x + r, y + r)]; },
  canStand(x, y, r, cur, noAcid, curCell) {
    for (const i of this.corners(x, y, r)) {
      if (i < 0 || Level.solid[i] || Level.block[i]) return false;
      const f = Level.floor[i], c = Level.ceil[i];
      if (c - f < CONFIG.MIN_GAP) return false;
      if (f - cur > CONFIG.STEP) return false;
      if (c - Math.max(f, cur) < CONFIG.MIN_GAP) return false;
      if (noAcid && Level.acid[i] && !Level.acid[curCell]) return false;
    }
    return true;
  },
  floorAt(x, y, r) { let m = -1e9; for (const i of this.corners(x, y, r)) if (i >= 0 && !Level.solid[i] && !Level.block[i]) m = Math.max(m, Level.floor[i]); return m < -1e8 ? 0 : m; },
  actorBlock(self, x, y, r) {
    for (const a of Actors.list) if (a !== self && a.solid && Math.hypot(a.x - x, a.y - y) < a.r + r) { if (Math.hypot(a.x - self.x, a.y - self.y) < a.r + r) continue; return true; }
    if (self !== Player && Player.alive && Math.hypot(Player.x - x, Player.y - y) < Player.r + r) return true;
    return false;
  },
  los(ax, ay, az, bx, by, bz) {
    const d = Math.hypot(bx - ax, by - ay), n = Math.max(1, Math.ceil(d / 8));
    for (let s = 1; s < n; s++) { const k = s / n, i = Level.at(ax + (bx - ax) * k, ay + (by - ay) * k); if (i < 0 || Level.solid[i]) return false; const z = az + (bz - az) * k; if (z <= Level.floor[i] || z >= Level.ceil[i]) return false; }
    return true;
  },
  shoot(src, ox, oy, oz, ang, range, dmg) {
    const dx = Math.cos(ang), dy = Math.sin(ang); let wt = range;
    for (let t = 4; t < range; t += 4) { const i = Level.at(ox + dx * t, oy + dy * t); if (i < 0 || Level.solid[i] || oz <= Level.floor[i] || oz >= Level.ceil[i]) { wt = t; break; } }
    const cand = [];
    const consider = (a) => { const rx = a.x - ox, ry = a.y - oy, t = rx * dx + ry * dy; if (t <= 0 || t > range) return; if (Math.abs(rx * dy - ry * dx) < a.r) cand.push({ a, t }); };
    for (const a of Actors.list) if (a !== src && a.shootable && a.hp > 0) consider(a);
    if (src !== Player && Player.alive) consider(Player);
    cand.sort((p, q) => p.t - q.t);
    for (const { a, t } of cand) {
      const tz = a.z + a.h * 0.5;
      if (t < wt && this.los(ox, oy, oz, a.x, a.y, tz)) {
        const hx = ox + dx * (t - a.r), hy = oy + dy * (t - a.r);
        if (a.type === 'BARRIL') Particles.burst('spark', hx, hy, tz, 4); else Particles.burst('blood', hx, hy, tz, a === Player ? 2 : 6, ang + Math.PI);
        Actors.damage(a, dmg, src); return a;
      }
    }
    if (wt < range) { const i = Level.at(ox + dx * wt, oy + dy * wt), fz = i >= 0 ? clamp(oz, Level.floor[i] + 2, Level.ceil[i] - 6) : oz; Particles.burst('spark', ox + dx * (wt - 4), oy + dy * (wt - 4), fz, 4, ang + Math.PI); Particles.burst('smoke', ox + dx * (wt - 6), oy + dy * (wt - 6), fz, 1); }
    return null;
  }
};

// ----- 9b. Jugador -----
const Player = {
  reset(diff, inv) {
    const [, sx, sy] = Level.def.ents.find(e => e[0] === 'JUGADOR');
    Object.assign(this, {
      x: (sx + 0.5) * 64, y: (sy + 0.5) * 64, ang: -Math.PI / 2, r: CONFIG.PLAYER_R, h: 56, vx: 0, vy: 0,
      health: 100, armor: 0, armorType: 0, ammo: { bullets: 50, shells: 0 }, cap: { bullets: 200, shells: 50 },
      weapons: { 1: true, 2: true, 3: false, 4: false }, alive: true, hp: 100, type: 'PLAYER', keys: {},
      bob: 0, bobPhase: 0, acidT: 0, painFlash: 0, bonusFlash: 0, acidFlash: 0, look: 0, lookT: 0, grinT: 0, diff, deathT: 0, inSecret: {}, shake: 0, lastCell: -1
    });
    if (inv) Object.assign(this, JSON.parse(JSON.stringify(inv)), { keys: {} });
    this.hp = this.health; this.floor = Phys.floorAt(this.x, this.y, this.r); this.z = this.floor; this.vz = 0;
  },
  cell() { return Level.at(this.x, this.y); },
  eyeZ() { return this.z + (this.alive ? CONFIG.EYE + this.bob : Math.max(8, CONFIG.EYE - this.deathT * 1.9)); },
  tick() {
    if (!this.alive) { this.deathT++; return; }
    const K = Input.keys, run = K.ShiftLeft || K.ShiftRight || TOUCH;
    let turn = 0; if (K.ArrowLeft) turn -= 1; if (K.ArrowRight) turn += 1;
    this.ang = normAng(this.ang + turn * CONFIG.TURN * (run ? 1.6 : 1) + (Input.consumeMouse() + Input.touch.turn) * CONFIG.MOUSE * (Game.sens / 5));
    Input.touch.turn = 0;
    let f = 0, s = 0;
    if (K.KeyW || K.ArrowUp) f += 1; if (K.KeyS || K.ArrowDown) f -= 1; if (K.KeyA) s -= 1; if (K.KeyD) s += 1;
    f -= Input.touch.my; s += Input.touch.mx;
    const fs = run ? CONFIG.RUN : CONFIG.WALK, ss = run ? CONFIG.STRAFE_RUN : CONFIG.STRAFE, ca = Math.cos(this.ang), sa = Math.sin(this.ang);
    const tx = ca * f * fs - sa * s * ss, ty = sa * f * fs + ca * s * ss;
    if (f || s) { this.vx += (tx - this.vx) * CONFIG.ACCEL; this.vy += (ty - this.vy) * CONFIG.ACCEL; } else { this.vx *= CONFIG.FRICTION; this.vy *= CONFIG.FRICTION; }
    if (Math.abs(this.vx) < 0.05) this.vx = 0; if (Math.abs(this.vy) < 0.05) this.vy = 0;
    this.move(this.vx, this.vy);
    this.floor = Phys.floorAt(this.x, this.y, this.r);
    if (this.z < this.floor) { this.z = Math.min(this.floor, this.z + 4); this.vz = 0; }
    else if (this.z > this.floor) { this.vz += 1; this.z = Math.max(this.floor, this.z - this.vz); } else this.vz = 0;
    const sp = Math.hypot(this.vx, this.vy); this.bobPhase += sp * 0.045; this.bob = Math.sin(this.bobPhase * 2) * Math.min(4, sp * 0.4);
    const c = this.cell();
    if (c >= 0 && Level.acid[c] && this.z <= Level.floor[c] + 1) { if (++this.acidT % CONFIG.ACID_PERIOD === 0) { this.damage(CONFIG.ACID_DMG, null); this.acidFlash = 2; } } else this.acidT = 0;
    if (c !== this.lastCell) { this.lastCell = c; Level.fire('enter', c); }
    const cx = c % MW, cy = Math.floor(c / MW);
    Level.def.secret.forEach((r, k) => { if (!this.inSecret[k] && cx >= r[0] && cx <= r[1] && cy >= r[2] && cy <= r[3]) { this.inSecret[k] = true; Stats.secrets++; HUD.msg('¡Zona secreta encontrada!'); Audio.sfx('secret'); } });
    if (Input.pressed('KeyE') || Input.pressed('Space')) this.use();
    for (const a of Actors.list) if (a.item && !a.dead && Math.hypot(a.x - this.x, a.y - this.y) < 32 && Math.abs(a.z - this.z) < 24) Items.pick(a);
    if (this.painFlash > 0) this.painFlash -= this.painFlash / 8 + 0.2;
    if (this.bonusFlash > 0) this.bonusFlash--; if (this.acidFlash > 0) this.acidFlash--; if (this.shake > 0) this.shake *= 0.8;
    if (this.lookT > 0 && --this.lookT === 0) this.look = 0; if (this.grinT > 0) this.grinT--;
  },
  move(dx, dy) {
    const cc = this.cell(), steps = Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 8) || 1;
    for (let k = 0; k < steps; k++) {
      const nx = this.x + dx / steps; if (Phys.canStand(nx, this.y, this.r, this.floor, false, cc) && !Phys.actorBlock(this, nx, this.y, this.r)) this.x = nx; else this.vx = 0;
      const ny = this.y + dy / steps; if (Phys.canStand(this.x, ny, this.r, this.floor, false, cc) && !Phys.actorBlock(this, this.x, ny, this.r)) this.y = ny; else this.vy = 0;
      this.floor = Phys.floorAt(this.x, this.y, this.r);
    }
  },
  use() {
    const dx = Math.cos(this.ang), dy = Math.sin(this.ang), here = this.cell();
    for (let t = 8; t <= 64 + this.r; t += 4) {
      const i = Level.at(this.x + dx * t, this.y + dy * t); if (i < 0 || i === here) continue;
      const d = Level.doorAt[i]; if (d) { Doors.use(d, this); return; }
      if (Level.ch[i] === 'S') { Game.exitSwitch(i); return; }
      if (Level.ch[i] === 'w' || Level.ch[i] === 'v') { Doors.wallSwitch(i); return; }
      if (Level.solid[i]) break;
    }
    Audio.sfx('noway');
  },
  damage(amt, src) {
    if (!this.alive || Game.godMode) return;
    if (this.diff === 1) amt = Math.max(1, amt * 0.5 | 0);
    let abs = 0; if (this.armorType) { abs = Math.min(this.armor, Math.floor(amt * (this.armorType === 1 ? 1 / 3 : 1 / 2))); this.armor -= abs; if (!this.armor) this.armorType = 0; }
    this.health -= amt - abs; this.hp = this.health; this.painFlash = Math.min(40, this.painFlash + amt); this.shake = Math.min(8, this.shake + amt / 6); Haptics.buzz(30);
    if (src && src !== this) { const rel = normAng(Math.atan2(src.y - this.y, src.x - this.x) - this.ang); this.look = rel < -0.5 ? -1 : rel > 0.5 ? 1 : 0; this.lookT = 35; this.dmgDir = rel; this.dmgT = 20; }
    if (this.health <= 0) { this.health = 0; this.alive = false; Audio.sfx('pdeath'); Game.setState('DEAD'); } else Audio.sfx('ppain');
  }
};

// ===== 11. ARMAS =====
const WDEF = { 1: { name: 'PUÑOS', ammo: null, cd: 14 }, 2: { name: 'PISTOLA', ammo: 'bullets', cd: 12 }, 3: { name: 'ESCOPETA', ammo: 'shells', cd: 37 }, 4: { name: 'AMETRALLADORA', ammo: 'bullets', cd: 4 } };
const Weapons = {
  reset() { Object.assign(this, { cur: 2, pending: 0, phase: 'ready', pt: 0, cool: 0, lastFire: -99, since: 99, flash: 0, flashV: 0, spin: 0, heat: 0, smoke: [] }); },
  has(n) { return Player.weapons[n] && (!WDEF[n].ammo || Player.ammo[WDEF[n].ammo] > 0); },
  select(n) { if (n !== this.cur && Player.weapons[n] && this.pending === 0) { this.pending = n; this.phase = 'lower'; this.pt = 6; } },
  best() { return this.has(4) ? 4 : this.has(3) ? 3 : this.has(2) ? 2 : 1; },
  tick() {
    for (const s of this.smoke) { s.t++; s.y -= 0.7; s.x += s.vx; } this.smoke = this.smoke.filter(s => s.t < 30);
    this.heat = Math.max(0, this.heat - 0.6);
    if (!Player.alive) return;
    for (const n of [1, 2, 3, 4]) if (Input.pressed('Digit' + n)) this.select(n);
    if (Input.wheel) { const order = [1, 2, 3, 4].filter(n => Player.weapons[n]); let k = order.indexOf(this.pending || this.cur); k = (k + Math.sign(Input.wheel) + order.length) % order.length; this.select(order[k]); Input.wheel = 0; }
    if (this.flash > 0) this.flash--; this.since++; if (this.cool > 0) this.cool--;
    if (this.phase === 'lower' && --this.pt <= 0) { this.cur = this.pending; this.pending = 0; this.phase = 'raise'; this.pt = 6; }
    else if (this.phase === 'raise' && --this.pt <= 0) this.phase = 'ready';
    const want = Input.fire || Input.keys.ControlLeft || Input.keys.ControlRight || Input.touch.fire || Input.pressed('Mouse0');
    if (want && this.phase === 'ready' && this.cool <= 0) { const d = WDEF[this.cur]; if (d.ammo && Player.ammo[d.ammo] <= 0) { this.select(this.best()); return; } this.fire(); }
  },
  puff(x, y) { this.smoke.push({ x: x + (rnd() - 0.5) * 4, y, t: 0, vx: (rnd() - 0.5) * 0.6 }); },
  fire() {
    const P_ = Player, d = WDEF[this.cur], oz = P_.z + CONFIG.EYE, aim = this.aim();
    this.cool = d.cd; this.since = 0; this.flashV = rint(3);
    if (this.cur === 1) { Audio.sfx('punch'); Phys.shoot(P_, P_.x, P_.y, oz, P_.ang, 84, (rint(10) + 1) * 2); }
    else if (this.cur === 2) {
      P_.ammo.bullets--; const exact = Game.tics - this.lastFire > 20;
      Phys.shoot(P_, P_.x, P_.y, oz, aim + (exact ? 0 : (rnd() * 2 - 1) * 0.02), 2048, (rint(3) + 1) * 5);
      Audio.sfx('pistol'); this.flash = 3; AI.noise(); Level.addLight(P_.x, P_.y, 55, 2); P_.shake += 1; this.puff(160, 112);
    } else if (this.cur === 4) {
      P_.ammo.bullets--; Phys.shoot(P_, P_.x, P_.y, oz, aim + (rnd() * 2 - 1) * 0.04, 2048, (rint(3) + 1) * 5);
      Audio.sfx('pistol'); this.flash = 2; this.spin++; this.heat = Math.min(100, this.heat + 4); AI.noise(); Level.addLight(P_.x, P_.y, 45, 2); P_.shake += 0.6;
      if (this.spin % 3 === 0) this.puff(162, 112);
    } else {
      P_.ammo.shells--; for (let k = 0; k < 7; k++) Phys.shoot(P_, P_.x, P_.y, oz, aim + (rnd() * 2 - 1) * 0.09, 2048, (rint(3) + 1) * 5);
      Audio.sfx('shotgun'); this.flash = 3; AI.noise(); Level.addLight(P_.x, P_.y, 95, 2); P_.shake += 4; Haptics.buzz(25);
      for (let k = 0; k < 3; k++) this.puff(160, 104);
    }
    this.lastFire = Game.tics;
    if (d.ammo && P_.ammo[d.ammo] <= 0) this.select(this.best());
  },
  aim() { // asistencia de puntería horizontal leve solo en táctil
    const P_ = Player; if (!TOUCH) return P_.ang; let best = null;
    for (const e of Actors.list) if (e.enemy && e.hp > 0) { const a = normAng(Math.atan2(e.y - P_.y, e.x - P_.x) - P_.ang); if (Math.abs(a) < 0.07 && (best === null || Math.abs(a) < Math.abs(best)) && Phys.los(P_.x, P_.y, P_.z + 41, e.x, e.y, e.z + 28)) best = a; }
    return best === null ? P_.ang : P_.ang + best;
  },
  draw(L) {
    const P_ = Player, sp = Math.hypot(P_.vx, P_.vy), bt = P_.bobPhase, VH = CONFIG.VIEW_H;
    const bx = Math.cos(bt) * Math.min(6, sp), by = Math.abs(Math.sin(bt)) * Math.min(4, sp * 0.5);
    let off = 0; if (this.phase === 'lower') off = (6 - this.pt) * 12; else if (this.phase === 'raise') off = this.pt * 12;
    if (!P_.alive) off = Math.min(90, P_.deathT * 3);

    if (this.cur === 1) { const img = Spr.frame('W_PUNOS', s < 8 ? 1 : 0); Render.blit(img, 100 + bx, VH - img.h + 4 + by + off, L, VH); }
    else if (this.cur === 2) {
      const img = Spr.frame('W_PISTOLA', s < 3 ? 1 : s < 6 ? 2 : 0), x = 130 + bx, y = VH - img.h + 6 + by + off + (s < 3 ? 3 : 0);
      if (this.flash > 0) Render.blit(fl, x + 10, y - 26, 31, VH); Render.blit(img, x, y, lit, VH);

      const hl = Math.min(3, Math.floor(this.heat / 25)), img = Spr.frame('W_AMETRA', hl * 2 + (this.spin & 1)), x = 118 + bx, y = VH - img.h + 6 + by + off + (s < 2 ? 2 : 0);
      if (this.flash > 0) Render.blit(fl, x + 22, y - 24, 31, VH); Render.blit(img, x, y, lit, VH);
    } else {
      const fr = s < 4 ? 1 : s < 10 ? 0 : s < 16 ? 2 : s < 22 ? 3 : s < 28 ? 4 : 0, img = Spr.frame('W_ESCOPETA', fr);
      const x = 115 + bx, y = VH - img.h + 6 + by + off + (s < 4 ? 8 : s < 10 ? 4 : 0);
      if (this.flash > 0) Render.blit(fl, x + 25, y - 26, 31, VH); Render.blit(img, x, y, lit, VH);
    }
    // humo del cañón (2D, semitransparente, sube y se dispersa)
    const B = Render.buf;
    for (const p of this.smoke) {
      const r = 2 + p.t / 6, a = 0.28 * (1 - p.t / 30);
      for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) {
        if (i * i + j * j > r * r || ((i + j + p.t) & 1)) continue;
        const X = Math.round(p.x + bx + i), Y = Math.round(p.y + j + off); if (X < 0 || X >= 320 || Y < 0 || Y >= VH) continue;
        const o = Y * 320 + X, c = B[o]; B[o] = rgb((c & 255) * (1 - a) + 170 * a, ((c >> 8) & 255) * (1 - a) + 170 * a, ((c >> 16) & 255) * (1 - a) + 175 * a);
      }
    }
  }
};

// ----- 11b. Puertas, llaves, trampas e interruptores -----
const Doors = {
  use(d, who) {
    const isP = who === Player;
    if ('Tt'.includes(d.type)) { if (isP) Audio.sfx('noway'); return; }
    if ('Bb'.includes(d.type)) { if (isP) { HUD.msg('Se abre desde otro lugar.'); Audio.sfx('noway'); } return; }
    if (d.locked > 0) { if (isP) { HUD.msg('Bloqueada. Espera ' + Math.ceil(d.locked / 35) + ' s.'); Audio.sfx('noway'); } return; }
    const k = KEY_OF[d.type];
    if (k && !(isP && Player.keys[k])) { if (isP) { HUD.msg('Necesitas la llave ' + KEY_NAME[k] + '.'); Audio.sfx('noway'); } return; }
    if (d.state === 'closed' || d.state === 'closing') { d.state = 'opening'; Audio.sfx('door', d.x * 64 + 32, d.y * 64 + 32); }
    else if (d.state === 'open' && !d.once) d.wait = CONFIG.DOOR_WAIT;
  },
  wallSwitch(i) {
    const ch = Level.ch[i]; if (Level.solidTex[i] === 'WSWITCH_ON') return;
    Level.solidTex[i] = 'WSWITCH_ON'; Audio.sfx('switch'); HUD.msg('Interruptor activado.');
    Level.fire(ch);
  },
  occupied(d) {
    const x0 = d.x * 64, y0 = d.y * 64, hit = (a) => a.x + a.r > x0 && a.x - a.r < x0 + 64 && a.y + a.r > y0 && a.y - a.r < y0 + 64;
    if (Player.alive && hit(Player)) return true;
    return Actors.list.some(a => (a.solid || a.enemy) && a.hp > 0 && hit(a));
  },
  tick() {
    for (const d of Level.doors) {
      if (d.locked > 0 && --d.locked === 0) { d.state = 'opening'; d.stay = true; HUD.msg('Las puertas se desbloquean.'); Audio.sfx('door', d.x * 64 + 32, d.y * 64 + 32); }
      if (d.state === 'opening') { d.h += CONFIG.DOOR_SPEED; if (d.h >= d.max) { d.h = d.max; d.state = 'open'; d.wait = CONFIG.DOOR_WAIT; } }
      else if (d.state === 'open') { if (!d.once && !d.stay && --d.wait <= 0) d.state = 'closing'; }
      else if (d.state === 'closing') {
        if (this.occupied(d) && d.locked === 0) { d.state = 'opening'; Audio.sfx('door', d.x * 64 + 32, d.y * 64 + 32); }
        else if (!this.occupied(d)) { d.h -= CONFIG.DOOR_SPEED; if (d.h <= 0) { d.h = 0; d.state = 'closed'; Audio.sfx('doorclose', d.x * 64 + 32, d.y * 64 + 32); } }
      }
      Level.ceil[d.i] = Level.floor[d.i] + d.h;
    }
  }
};

// ----- 9c. Actores -----
const EDEF = {
  SOLDADO: { hp: 20, pain: 200, pellets: 1, drop: 'MUNICION', alert: 'alertA', speed: 2, spr: 'SOLDADO' },
  ESCOPETERO: { hp: 30, pain: 170, pellets: 3, drop: 'CARTUCHOS', alert: 'alertB', speed: 2, spr: 'ESCOPETERO' },
  DEMONIO: { hp: 60, pain: 200, plasma: true, alert: 'alertC', speed: 2, spr: 'DEMONIO' },
  BRUTO: { hp: 150, pain: 180, melee: true, alert: 'alertD', speed: 3.6, spr: 'BRUTO', r: 26 },
  ESPECTRO: { hp: 150, pain: 180, melee: true, alert: 'alertD', speed: 3.6, spr: 'BRUTO', r: 26 }
};
const ITEMS = ['SALUD', 'MUNICION', 'ARMADURA', 'MEGA_ARMADURA', 'ESCOPETA', 'CARTUCHOS', 'LLAVE_ROJA', 'LLAVE_AZUL', 'LLAVE_AMARILLA', 'MOCHILA', 'NUCLEO', 'AMETRALLADORA'];
// ===== 4. ESTADO DEL JUEGO (contadores del nivel) =====
const Stats = { reset() { Object.assign(this, { kills: 0, killsTotal: 0, items: 0, itemsTotal: 0, secrets: 0, secretsTotal: Level.def.secret.length, tics: 0 }); } };

const Actors = {
  list: [],
  reset(diff) {
    this.list = [];
    for (const [type, cx, cy, note] of Level.def.ents) {
      if (type === 'JUGADOR') continue;
      if (note.includes('≥2') && diff < 2) continue;
      if (note.includes('dificultad 3') && diff < 3) continue;
      const a = this.spawn(type, (cx + 0.5) * 64, (cy + 0.5) * 64);
      if (a.enemy) { Stats.killsTotal++; a.ang = Math.atan2(Player.y - a.y, Player.x - a.x) + (rnd() - 0.5) * 2; }
      if (a.item) { a.counted = !type.startsWith('LLAVE_'); if (a.counted) Stats.itemsTotal++; }
    }
  },
  spawn(type, x, y) {
    const a = { type, x, y, r: CONFIG.ACTOR_R, h: 56, hp: 1, solid: false, shootable: false, state: 'IDLE', timer: 0, anim: 0, ang: 0, zoff: 0, hitT: 0 };
    if (EDEF[type]) Object.assign(a, { enemy: true, solid: true, shootable: true, hp: EDEF[type].hp, def: EDEF[type], target: null, react: 0, dec: 0, dir: 0, stuck: 0, frame: 0, r: EDEF[type].r || CONFIG.ACTOR_R });
    else if (ITEMS.includes(type)) Object.assign(a, { item: true, r: 16 });
    else if (type === 'BARRIL') Object.assign(a, { solid: true, shootable: true, hp: 20, r: 16, h: 32 });
    else if (type === 'CANDELABRO') Object.assign(a, { solid: true, r: 16, h: 72 });
    a.z = Phys.floorAt(x, y, a.item ? 1 : Math.min(a.r, 16));
    a.sprite = () => this.sprite(a);
    a.flip = () => a.enemy && a.hp > 0 && normAng(a.ang - Math.atan2(Player.y - a.y, Player.x - a.x)) > 0.4;
    this.list.push(a); return a;
  },
  fx(kind, x, y, z) { const a = this.spawn(kind, x, y); a.z = z - 16; a.fx = true; a.timer = 0; a.fullbright = true; return a; },
  sprite(a) {
    const t = Game.tics;
    if (a.enemy) {
      let f = a.frame;
      if (a.hp > 0 && f < 4 && Math.abs(normAng(a.ang - Math.atan2(Player.y - a.y, Player.x - a.x))) > 2.3) f += 12; // vista de espaldas
      return Spr.frame(a.def.spr, f);
    }
    switch (a.type) {
      case 'BARRIL': return Spr.frame('BARRIL', t >> 4);
      case 'CANDELABRO': return Spr.frame('CANDELABRO', t >> 2);
      case 'ARMADURA': case 'MEGA_ARMADURA': case 'LLAVE_ROJA': case 'LLAVE_AZUL': case 'LLAVE_AMARILLA': case 'NUCLEO': return Spr.frame(a.type, t >> 3);
      case 'PLASMA': return Spr.frame('PLASMA', t >> 2);
      case 'BOOM': return Spr.frame('BOOM', Math.min(2, a.timer / 5 | 0));
      default: return Spr.frame(a.type, 0);
    }
  },
  damage(a, amt, src) {
    if (a === Player) { Player.damage(amt, src); return; }
    if (a.hp <= 0) return;
    a.hp -= amt; a.hitT = 2;
    if (a.hp <= 0) { this.kill(a, src); return; }
    if (a.enemy) {
      if (src && src !== a && (src === Player || (src.enemy && src.type !== a.type))) a.target = src;
      if (a.state === 'IDLE') AI.wake(a, src && src !== a ? src : Player);
      if (rnd() * 256 < a.def.pain && a.state !== 'DEATH') { a.state = 'PAIN'; a.timer = 6; a.frame = 6; Audio.sfx('epain', a.x, a.y); }
    }
  },
  kill(a) {
    if (a.type === 'BARRIL') { a.state = 'EXPLODING'; a.timer = 5; a.shootable = false; return; }
    if (!a.enemy) return;
    a.state = 'DEATH'; a.timer = 0; a.solid = false; a.shootable = false; a.frame = 7;
    Stats.kills++; Audio.sfx('edeath', a.x, a.y); Particles.burst('blood', a.x, a.y, a.z + 30, 14);
    if (a.def.drop) { const d = this.spawn(a.def.drop, a.x, a.y); d.dropped = true; }
  },
  explode(x, y, z, src) {
    this.fx('BOOM', x, y, z + 16); Audio.sfx('barrel', x, y); Level.addLight(x, y, 140, 3); Particles.burst('debris', x, y, z + 16, 14); Particles.burst('smoke', x, y, z + 20, 6);
    if (Math.hypot(Player.x - x, Player.y - y) < 400) Player.shake = Math.min(10, Player.shake + 8);
    const hit = (t) => { const d = Math.hypot(t.x - x, t.y - y); if (d < 128 && Phys.los(x, y, z + 16, t.x, t.y, t.z + 28)) this.damage(t, Math.floor(128 - d), src); };
    for (const t of this.list.slice()) if (t.shootable && t.hp > 0) hit(t);
    if (Player.alive) hit(Player);
  },
  tick() {
    for (const a of this.list) {
      if (a.dead) continue; if (a.hitT > 0) a.hitT--;
      if (a.enemy) { AI.think(a); continue; }
      if (a.item) { a.zoff = 2 + 2 * Math.sin(Game.tics * 2 * Math.PI / 70); continue; }
      if (a.type === 'BARRIL' && a.state === 'EXPLODING' && --a.timer <= 0) { a.dead = true; a.solid = false; this.explode(a.x, a.y, a.z, a); continue; }
      if (a.type === 'PLASMA') { Projectiles.tick(a); continue; }
      if (a.type === 'CANDELABRO' && Game.tics % 4 === 0) Level.addLight(a.x, a.y, 6, 1);
      if (a.fx) { a.timer++; if (a.timer >= 15) a.dead = true; }
    }
    this.list = this.list.filter(a => !a.dead);
  }
};

// ----- 9d. Objetos recogibles -----
const Items = {

    const ammoAdd = (k, n) => { if (P_.ammo[k] < P_.cap[k]) { P_.ammo[k] = Math.min(P_.cap[k], P_.ammo[k] + n); return true; } return false; };
    switch (a.type) {
      case 'SALUD': if (P_.health < 100) { P_.health = Math.min(100, P_.health + 25); ok = true; msg = 'Botiquín recogido.'; } break;
      case 'MUNICION': if (ammoAdd('bullets', 10)) { ok = true; msg = 'Cargador recogido.'; snd = 'ammo'; } break;
      case 'CARTUCHOS': if (ammoAdd('shells', 4)) { ok = true; msg = 'Caja de cartuchos.'; snd = 'ammo'; } break;
      case 'ARMADURA': if (P_.armor < 100) { P_.armor = 100; P_.armorType = 1; ok = true; msg = 'Chaleco de combate recogido.'; snd = 'ammo'; } break;
      case 'MEGA_ARMADURA': if (P_.armor < 200) { P_.armor = 200; P_.armorType = 2; ok = true; msg = '¡Blindaje pesado!'; snd = 'secret'; } break;
      case 'ESCOPETA':
        if (!P_.weapons[3]) { P_.weapons[3] = true; ammoAdd('shells', 8); ok = true; msg = '¡Escopeta táctica!'; snd = 'wpn'; Weapons.select(3); P_.grinT = 70; }
        else if (ammoAdd('shells', 4)) { ok = true; msg = 'Caja de cartuchos.'; snd = 'ammo'; }
        break;
      case 'AMETRALLADORA':
        if (!P_.weapons[4]) { P_.weapons[4] = true; ok = true; msg = '¡Ametralladora rotativa!'; snd = 'wpn'; Weapons.select(4); P_.grinT = 70; }
        if (ammoAdd('bullets', 20)) { ok = true; if (!msg) { msg = 'Cargador recogido.'; snd = 'ammo'; } }
        break;
      case 'MOCHILA': P_.cap = { bullets: 400, shells: 100 }; ammoAdd('bullets', 10); ammoAdd('shells', 4); ok = true; msg = '¡Mochila de munición! Capacidad doble.'; snd = 'wpn'; break;
      case 'NUCLEO': if (P_.health < 200) { P_.health = Math.min(200, P_.health + 100); ok = true; msg = '¡Núcleo vital!'; snd = 'secret'; P_.grinT = 70; } break;
      case 'LLAVE_ROJA': case 'LLAVE_AZUL': case 'LLAVE_AMARILLA': {
        const k = { LLAVE_ROJA: 'red', LLAVE_AZUL: 'blue', LLAVE_AMARILLA: 'yellow' }[a.type];
        P_.keys[k] = true; ok = true; msg = 'Tarjeta de acceso ' + KEY_NAME[k] + '.'; snd = 'wpn'; break;
      }
    }
    if (!ok) return;
    a.dead = true; P_.hp = P_.health; if (a.counted && !a.dropped) Stats.items++;
    P_.bonusFlash = 4; HUD.msg(msg); Audio.sfx(snd);

  }

// ----- 9e. Proyectiles -----
const Projectiles = {
  launch(src, tgt) {
    const sp = 10 * (Game.diff === 3 ? 1.5 : 1), z = src.z + 32;
    const a = Actors.spawn('PLASMA', src.x, src.y); a.fullbright = true; a.r = 6; a.owner = src; a.z = z;
    const dx = tgt.x - src.x, dy = tgt.y - src.y, d = Math.hypot(dx, dy) || 1, tz = tgt.z + 28;
    a.vx = dx / d * sp; a.vy = dy / d * sp; a.vz = (tz - z) / (d / sp); a.zoff = -6; Audio.sfx('plasma', src.x, src.y);
  },
  tick(a) {
    Level.addLight(a.x, a.y, 20, 1); if (Game.tics & 1) Particles.burst('spark', a.x, a.y, a.z, 1);
    for (let s = 0; s < 2; s++) {
      a.x += a.vx / 2; a.y += a.vy / 2; a.z += a.vz / 2;
      const i = Level.at(a.x, a.y);
      if (i < 0 || Level.solid[i] || a.z <= Level.floor[i] || a.z + 4 >= Level.ceil[i]) return this.boom(a, null);
      if (Player.alive && Math.hypot(Player.x - a.x, Player.y - a.y) < Player.r + a.r && a.z >= Player.z - 4 && a.z <= Player.z + 60) return this.boom(a, Player);
      for (const t of Actors.list) if (t !== a && t !== a.owner && t.shootable && t.hp > 0 && Math.hypot(t.x - a.x, t.y - a.y) < t.r + a.r && a.z >= t.z && a.z <= t.z + t.h) return this.boom(a, t);
    }
  },
  boom(a, t) {
    a.dead = true; if (t) Actors.damage(t, (rint(8) + 1) * 3, a.owner);
    const b = Actors.fx('BOOM', a.x - a.vx, a.y - a.vy, a.z); b.z = a.z - 16; Audio.sfx('pboom', a.x, a.y); Level.addLight(a.x, a.y, 70, 2); Particles.burst('spark', a.x, a.y, a.z, 8);
  }
};

// ===== 10. IA DE ENEMIGOS =====
const AI = {
  dirs: [0, 1, 2, 3, 4, 5, 6, 7].map(k => k * Math.PI / 4),
  sees(e, t) { const d = Math.hypot(t.x - e.x, t.y - e.y); if (d > CONFIG.MAX_DIST) return false; return Phys.los(e.x, e.y, e.z + 41, t.x, t.y, t.z + 28); },
  wake(e, tgt) {
    if (e.state !== 'IDLE') return;
    e.target = tgt || Player; e.state = 'CHASE'; e.react = 8 * (Game.diff === 1 ? 2 : 1); e.dec = 0; e.ang = Math.atan2(e.target.y - e.y, e.target.x - e.x);
    Audio.sfx(e.def.alert, e.x, e.y);
  },
  noise() {
    const start = Player.cell(); if (start < 0) return;
    const dist = new Int16Array(Level.N).fill(-1), q = [start]; dist[start] = 0;
    for (let h = 0; h < q.length; h++) { const c = q[h]; if (dist[c] >= 40) continue; for (const o of [1, -1, MW, -MW]) { const n = c + o; if (n < 0 || n >= Level.N || dist[n] >= 0 || Level.solid[n] || Level.ceil[n] - Level.floor[n] < CONFIG.MIN_GAP) continue; dist[n] = dist[c] + 1; q.push(n); } }
    for (const e of Actors.list) if (e.enemy && e.state === 'IDLE') { const c = Level.at(e.x, e.y); if (c >= 0 && dist[c] >= 0) this.wake(e, Player); }
  },
  tryStep(e, ang, sp) {
    const nx = e.x + Math.cos(ang) * sp, ny = e.y + Math.sin(ang) * sp, cc = Level.at(e.x, e.y), rr = Math.min(e.r, 20);
    if (Phys.canStand(nx, ny, rr, e.z, true, cc) && !Phys.actorBlock(e, nx, ny, rr)) { e.x = nx; e.y = ny; e.z = Phys.floorAt(e.x, e.y, rr); return true; }
    const i = Level.at(e.x + Math.cos(ang) * (rr + 8), e.y + Math.sin(ang) * (rr + 8));
    if (i >= 0 && Level.doorAt[i] && Level.doorAt[i].type === 'D') Doors.use(Level.doorAt[i], e);
    return false;
  },
  think(e) {
    const fast = Game.diff === 3 ? 1.5 : 1;
    switch (e.state) {
      case 'IDLE':
        e.frame = 0;
        if (Game.tics % 4 === 0 && Player.alive) { const rel = Math.abs(normAng(Math.atan2(Player.y - e.y, Player.x - e.x) - e.ang)); if (rel <= Math.PI / 2 && this.sees(e, Player)) this.wake(e, Player); }
        break;
      case 'CHASE': {
        let tgt = e.target;
        if (!tgt || (tgt !== Player && tgt.hp <= 0) || (tgt === Player && !Player.alive)) { tgt = e.target = Player; if (!Player.alive) { e.frame = 0; return; } }
        e.anim++; e.frame = (e.anim / (e.def.melee ? 3 : 5) | 0) % 4;
        if (e.react > 0) e.react--;
        if (--e.dec <= 0) {
          e.dec = 4; const d = Math.hypot(tgt.x - e.x, tgt.y - e.y);
          if (e.react === 0 && this.sees(e, tgt)) {
            if (e.def.melee) { if (d < 64 + e.r) { e.state = 'ATTACK'; e.timer = 0; e.frame = 4; return; } }
            else { const p = clamp(1 - d / 1024, 0.1, 0.6) * 0.25; if ((e.def.plasma && d < 64) || rnd() < p) { e.state = 'ATTACK'; e.timer = 0; e.ang = Math.atan2(tgt.y - e.y, tgt.x - e.x); e.frame = 4; return; } }
          }
          let k = Math.round(Math.atan2(tgt.y - e.y, tgt.x - e.x) / (Math.PI / 4));
          if (rnd() < 0.25) k += rnd() < 0.5 ? 1 : -1;
          if (e.stuck > 35) { k = rint(8); e.stuck = 0; }
          e.dir = ((k % 8) + 8) % 8;
        }
        let moved = false;
        for (const o of [0, 1, -1, 2, -2, 3, -3]) { const dd = (e.dir + o + 8) % 8; if (this.tryStep(e, this.dirs[dd], e.def.speed)) { e.ang = this.dirs[dd]; if (o) e.dir = dd; moved = true; break; } }
        if (!moved) e.stuck += 4; else e.stuck = Math.max(0, e.stuck - 1);
        break;
      }
      case 'ATTACK': {
        const tgt = e.target || Player, prep = Math.round(8 / fast); e.timer++;
        if (e.timer === prep) {
          e.frame = 5; e.ang = Math.atan2(tgt.y - e.y, tgt.x - e.x); const d = Math.hypot(tgt.x - e.x, tgt.y - e.y);
          if (e.def.melee) { if (d < 64 + e.r + tgt.r) { Actors.damage(tgt, (rint(10) + 1) * 4, e); Audio.sfx('bite', e.x, e.y); } }
          else if (e.def.plasma) { if (d < 64 + tgt.r) { Actors.damage(tgt, (rint(8) + 1) * 3, e); Audio.sfx('claw', e.x, e.y); } else Projectiles.launch(e, tgt); }
          else {
            Audio.sfx(e.def.pellets > 1 ? 'shotgun' : 'pistol', e.x, e.y); Level.addLight(e.x, e.y, 50, 1);
            if (this.sees(e, tgt)) for (let k = 0; k < e.def.pellets; k++) if (rnd() < clamp(1 - d / 1500, 0.3, 0.9)) Actors.damage(tgt, (rint(5) + 1) * 3, e); // V2: precisión por distancia
          }
        } else if (e.timer === prep + 4) e.frame = 4;
        else if (e.timer >= prep + Math.round(8 / fast)) { e.state = 'CHASE'; e.dec = 0; }
        break;
      }
      case 'PAIN': if (--e.timer <= 0) { e.state = 'CHASE'; e.dec = 0; if (e.def.plasma) e.react = 0; } break;
      case 'DEATH': e.timer++; e.frame = Math.min(11, 7 + (e.timer / 8 | 0)); break;
    }
  }
};

    Render.text('ARMAS', 105, Y + 24, COL.gray, 1, false);
    const lvl = P_.health > 80 ? 0 : P_.health > 60 ? 1 : P_.health > 40 ? 2 : P_.health > 20 ? 3 : 4;

    Render.blit(Face.get(lvl, P_.lookT > 0 ? P_.look : lookIdle, mode), 140, Y + 1, 31);

// ===== 12. AUTOMAPA =====
const Automap = {
  zoom: 1, rot: true,
  line(x0, y0, x1, y1, col) { const n = Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))) || 1; for (let s = 0; s <= n; s++) { const x = Math.round(x0 + (x1 - x0) * s / n), y = Math.round(y0 + (y1 - y0) * s / n); if (x >= 0 && x < 320 && y >= 0 && y < CONFIG.VIEW_H) Render.buf[y * 320 + x] = col; } },
  draw() {
    Render.fill(0, 0, 320, CONFIG.VIEW_H, 0xFF000000);
    if (Input.pressed('Equal') || Input.pressed('NumpadAdd')) this.zoom = Math.min(4, this.zoom * 1.25);
    if (Input.pressed('Minus') || Input.pressed('NumpadSubtract')) this.zoom = Math.max(0.5, this.zoom / 1.25);
    if (Input.pressed('KeyR')) this.rot = !this.rot;
    const k = 4 * this.zoom / 64, cx = 160, cy = 84, rot = this.rot ? -Player.ang - Math.PI / 2 : 0, cr = Math.cos(rot), sr = Math.sin(rot);
    const T = (wx, wy) => { const x = (wx - Player.x) * k, y = (wy - Player.y) * k; return [cx + x * cr - y * sr, cy + x * sr + y * cr]; };
    const blocked = (i) => Level.solid[i] || (Level.doorAt[i] && 'FTt'.includes(Level.doorAt[i].type) && Level.doorAt[i].state === 'closed');
    const dcol = { R: COL.red, A: rgb(90, 140, 255), Y: COL.yellow };
    for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
      const a = y * MW + x;
      for (const [dx, dy] of [[1, 0], [0, 1]]) {
        const X = x + dx, Yy = y + dy; if (X >= MW || Yy >= MH) continue;
        const b = Yy * MW + X; if (!Level.seen[a] && !Level.seen[b]) continue;
        let col = 0; const sa = blocked(a), sb = blocked(b);
        if (sa !== sb) col = COL.red;
        else if (!sa && (Level.doorAt[a] || Level.doorAt[b])) { const d = Level.doorAt[a] || Level.doorAt[b]; col = dcol[d.type] || rgb(255, 240, 150); }
        else if (!sa && Level.floor[a] !== Level.floor[b]) col = rgb(170, 130, 60);
        if (!col) continue;
        const [p0, p1] = dx ? [[X * 64, y * 64], [X * 64, y * 64 + 64]] : [[x * 64, Yy * 64], [x * 64 + 64, Yy * 64]];
        const A = T(p0[0], p0[1]), B = T(p1[0], p1[1]); this.line(A[0], A[1], B[0], B[1], col);
      }
    }
    const ang = this.rot ? -Math.PI / 2 : Player.ang, ca = Math.cos(ang), sa = Math.sin(ang);
    const tip = [cx + ca * 8, cy + sa * 8], l = [cx - ca * 6 - sa * 4, cy - sa * 6 + ca * 4], r = [cx - ca * 6 + sa * 4, cy - sa * 6 - ca * 4];
    this.line(tip[0], tip[1], l[0], l[1], COL.white); this.line(tip[0], tip[1], r[0], r[1], COL.white); this.line(cx - ca * 6, cy - sa * 6, tip[0], tip[1], COL.white);
    const pct = (a, b) => (b ? Math.round(a * 100 / b) : 100) + '%';
    Render.text('BAJAS ' + pct(Stats.kills, Stats.killsTotal) + '  OBJETOS ' + pct(Stats.items, Stats.itemsTotal) + '  SECRETOS ' + pct(Stats.secrets, Stats.secretsTotal), 2, 150, COL.white);
    Render.text('TIEMPO ' + Game.fmtTime(Stats.tics), 2, 159, COL.white);
    Render.text('NIVEL ' + Level.def.id + ' — ' + Level.def.name, 2, 2, COL.yellow);
  }
};

// ===== 15. AUDIO (Web Audio, todo sintetizado; música original) =====
const Audio = {
  ctx: null, muted: false, musVol: 0.35, sfxVol: 0.6,

      const c = this.ctx = new AC();

      this.sfxG = c.createGain(); this.sfxG.gain.value = this.sfxVol; this.sfxG.connect(this.master);
      this.musG = c.createGain(); this.musG.gain.value = this.musVol; this.musG.connect(this.master);

  setVols() { if (!this.ctx) return; this.sfxG.gain.value = this.sfxVol; this.musG.gain.value = Game.state === 'PAUSED' ? Math.min(0.1, this.musVol) : this.musVol; },
  out(x, y) {

      case 'shotgun': this.noise(g, t, 0.18, 1200, 200, 'lowpass', 1.2); this.osc(g, t, 0.2, 'sine', 70, 35, 0.8); this.noise(g, t + 0.25, 0.04, 3000, 2000, 'bandpass', 0.5); this.noise(g, t + 0.4, 0.04, 2500, 1500, 'bandpass', 0.5); break;

  // Música original: metal industrial 8 bits, 140 BPM; cada nivel transpone y alterna el patrón B

    patA: [40,0,40,40, 40,0,40,40, 43,0,0,42, 0,0,40,0,   40,0,40,40, 40,0,40,40, 38,0,0,38, 35,0,0,0],
    patB: [50,0,0,0, 0,0,40,0, 48,0,0,0, 0,0,40,0,   45,0,0,0, 0,0,40,0, 47,0,0,0, 0,0,40,40],
    patC: [40,0,0,47, 0,0,45,0, 43,0,0,40, 0,0,41,0,  40,0,0,47, 0,0,45,0, 46,0,45,0, 43,0,40,0],

    stop() { this.on = false; clearInterval(this.timer); },

// ===== 14. MENÚS Y FLUJO DE PANTALLAS (Game) =====
const INTRO = ['FOBOS-1. HANGAR NORTE.', 'La escuadra entró hace 20 minutos.', 'La radio solo trae estática.', 'No hay nave de regreso.', 'Solo hay una salida: avanzar.'];
const Game = {
  state: 'TITLE', tics: 0, stateT: 0, diff: 2, sens: 5, sel: 0, showFps: false, crosshair: false, fps: 0, map: false, godMode: false, levelInv: null, exitT: -1,
  setState(s) {
    this.state = s; this.stateT = 0; this.sel = 0;
    if (s === 'PAUSED' && Audio.ctx) Audio.setVols();
    if (s === 'PLAYING' && Audio.ctx) { Audio.setVols(); Audio.music.start(); }
    if (s === 'DEAD') { Audio.music.stop(); if (Audio.ctx) { const t = Audio.ctx.currentTime; [52, 47, 40].forEach((n, k) => Audio.osc(Audio.musG, t + k * 0.3, 0.8, 'sawtooth', Audio.music.hz(n), Audio.music.hz(n - 1), 0.2)); } }
    if (s === 'LEVEL_DONE') { Audio.music.stop(); this.tally = [0, 0, 0, 0]; if (document.exitPointerLock && Input.locked) document.exitPointerLock(); }
  },
  start(diff, lvl = 0, inv = null) {
    this.diff = diff; rnd = mulberry32(1993 + diff + lvl * 101);
    Level.load(lvl); Stats.reset(); Player.reset(diff, inv); Weapons.reset(); Actors.reset(diff); Particles.reset();
    if (inv && inv.cur && Player.weapons[inv.cur]) Weapons.cur = inv.cur;
    this.levelInv = inv; this.exitT = -1; this.map = false; HUD.mt = 0;
    Audio.music.stop(); this.setState('PLAYING');
  },
  exitSwitch(i) { if (this.exitT >= 0) return; Level.solidTex[i] = 'SWITCH_ON'; Audio.sfx('switch'); this.exitT = 35; },
  fmtTime(t) { const s = Math.floor(t / 35); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); },
  tick() {
    this.tics++; this.stateT++; const I = Input;
    if (I.pressed('KeyF')) this.showFps = !this.showFps;
    if (I.pressed('KeyM')) Audio.toggleMute();
    if (I.pressed('KeyC')) this.crosshair = !this.crosshair;
    switch (this.state) {
      case 'TITLE':
        Player.ang += 0.004;
        if (I.pressed('Enter') || I.pressed('Mouse0')) { Audio.unlock(); this.setState('INTRO'); }
        break;
      case 'INTRO': if (this.stateT > 210 || (this.stateT > 5 && (I.pressed('Enter') || I.pressed('Space') || I.pressed('Mouse0') || I.pressed('Escape')))) this.setState('DIFFICULTY'); break;
      case 'DIFFICULTY':
        if (I.pressed('ArrowUp')) this.sel = (this.sel + 2) % 3; if (I.pressed('ArrowDown')) this.sel = (this.sel + 1) % 3;
        for (const n of [1, 2, 3]) if (I.pressed('Digit' + n)) return this.start(n);
        if (I.pressed('Enter') || I.pressed('Mouse0')) this.start(this.sel + 1);
        break;
      case 'PLAYING':
        if ((I.pressed('Escape') && !(I.ignoreEsc > performance.now())) || I.pressed('KeyP')) { if (document.exitPointerLock && I.locked) document.exitPointerLock(); this.setState('PAUSED'); break; }
        if (I.pressed('Tab')) this.map = !this.map;
        Stats.tics++;
        Level.tick(); Player.tick(); Weapons.tick(); Doors.tick(); Actors.tick(); Particles.tick(); HUD.tick();
        if (this.exitT > 0 && --this.exitT === 0) this.setState('LEVEL_DONE');
        break;
      case 'PAUSED': {
        if ((I.pressed('Escape') && !(I.ignoreEsc > performance.now())) || I.pressed('KeyP')) { this.setState('PLAYING'); break; }
        if (I.pressed('ArrowUp')) this.sel = (this.sel + 4) % 5; if (I.pressed('ArrowDown')) this.sel = (this.sel + 1) % 5;
        const lr = (I.pressed('ArrowRight') ? 1 : 0) - (I.pressed('ArrowLeft') ? 1 : 0);
        if (lr) { if (this.sel === 1) this.sens = clamp(this.sens + lr, 1, 10); if (this.sel === 2) Audio.musVol = clamp(Math.round((Audio.musVol + lr * 0.05) * 100) / 100, 0, 1); if (this.sel === 3) Audio.sfxVol = clamp(Math.round((Audio.sfxVol + lr * 0.1) * 10) / 10, 0, 1); Audio.setVols(); }
        if (I.pressed('Enter') || I.pressed('Mouse0')) { if (this.sel === 0) this.setState('PLAYING'); if (this.sel === 4) this.start(this.diff, Level.num, this.levelInv); }
        break;
      }
      case 'DEAD': Player.tick(); Actors.tick(); Doors.tick(); Particles.tick(); if (this.stateT > 35 && (I.pressed('Enter') || I.pressed('Mouse0'))) this.start(this.diff, Level.num, this.levelInv); break;
      case 'LEVEL_DONE': {
        const goal = [Stats.killsTotal ? Math.round(Stats.kills * 100 / Stats.killsTotal) : 100, Stats.itemsTotal ? Math.round(Stats.items * 100 / Stats.itemsTotal) : 100, Stats.secretsTotal ? Math.round(Stats.secrets * 100 / Stats.secretsTotal) : 100, Math.floor(Stats.tics / 35)];
        for (let k = 0; k < 4; k++) if (this.tally[k] < goal[k]) { this.tally[k] = Math.min(goal[k], this.tally[k] + 2); if (this.tics % 3 === 0) Audio.sfx('tick'); break; }
        if (this.stateT > 35 && (I.pressed('Enter') || I.pressed('Mouse0'))) {
          const nx = Level.num + 1, P_ = Player;
          if (nx < LEVELS.length) this.start(this.diff, nx, { health: Math.max(P_.health, 1), armor: P_.armor, armorType: P_.armorType, ammo: { ...P_.ammo }, weapons: { ...P_.weapons }, cap: { ...P_.cap }, cur: Weapons.cur });
          else this.setState('TITLE');
        }
        break;
      }
    }
    I.endTick();
  },
  render3D() {
    const P_ = Player, sh = P_.shake > 0.3 ? P_.shake : 0;
    const ox = sh ? (rnd() - 0.5) * sh * 0.006 : 0;
    Render.view(P_.x, P_.y, P_.ang + ox, P_.eyeZ() + (sh ? (rnd() - 0.5) * sh : 0), Weapons.flash > 0 ? 6 : 0);

  },
  render() {
    const R = Render, s = this.state;
    if (s === 'TITLE') {
      this.render3D(); R.tint(0, 0, 0, 0.5); R.fill(0, 168, 320, 32, 0xFF000000);
      R.center('PROTOCOLO FOBOS', 40, rgb(200, 30, 20), 3); R.center('PROTOCOLO FOBOS', 39, rgb(255, 80, 50), 3);
      R.center('EPISODIO 1 — 6 NIVELES', 75, COL.yellow, 1);
      if ((this.tics >> 4) & 1) R.center(TOUCH ? 'TOCA LA PANTALLA PARA COMENZAR' : 'PULSA ENTER PARA COMENZAR', 130, COL.white, 1);
      R.center(TOUCH ? 'JOYSTICK IZQ. · ARRASTRA A LA DER. PARA GIRAR' : 'WASD MOVER · RATÓN GIRAR · CLIC DISPARAR · E USAR', 186, COL.gray, 1);
    } else if (s === 'INTRO') {
      R.fill(0, 0, 320, 200, 0xFF000000);
      const r = mulberry32(12); for (let k = 0; k < 60; k++) R.buf[(r() * 200 | 0) * 320 + (r() * 320 | 0)] = rgb(150, 150, 170);
      let left = Math.floor(this.stateT / 2);
