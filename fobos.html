    } else if (s === 'DIFFICULTY') {
      R.fill(0, 0, 320, 200, 0xFF100404); R.center('ELIGE DIFICULTAD', 50, COL.red, 2);
      ['1 — RECLUTA', '2 — SOLDADO', '3 — PESADILLA'].forEach((t, k) => { R.text(t, 110, 90 + k * 16, k === this.sel ? COL.yellow : COL.white); if (k === this.sel) this.skull(92, 88 + k * 16); });
    } else {
      const P_ = Player;
      if (this.map && s === 'PLAYING') Automap.draw();
      else {
        this.render3D();
        const c = P_.cell(), L = R.lightLevel(c >= 0 ? Level.lightCur[c] : 160, 0, Weapons.flash > 0 ? 6 : 0);
        if (s !== 'DEAD') Weapons.draw(Math.max(L, 8));
        if (P_.painFlash > 0) R.tint(255, 0, 0, Math.min(0.6, P_.painFlash / 50));
        if (P_.bonusFlash > 0) R.tint(255, 220, 80, 0.15);
        if (P_.acidFlash > 0) R.tint(40, 255, 60, 0.18);
      }
      HUD.draw();
      if (s === 'PAUSED') {
        R.tint(0, 0, 0, 0.6); R.center('PAUSA', 30, COL.red, 3);
        const items = ['CONTINUAR', 'SENSIBILIDAD < ' + this.sens + ' >', 'MÚSICA < ' + Math.round(Audio.musVol * 100) + '% >', 'EFECTOS < ' + Math.round(Audio.sfxVol * 100) + '% >', 'REINICIAR NIVEL'];
        items.forEach((t, k) => { R.text(t, 100, 70 + k * 14, k === this.sel ? COL.yellow : COL.white); if (k === this.sel) this.skull(82, 68 + k * 14); });
      } else if (s === 'DEAD') {
        R.tint(160, 0, 0, Math.min(0.55, this.stateT / 35 * 0.55));
        if (this.stateT > 35) { R.center('HAS CAÍDO EN FOBOS', 60, COL.white, 2); R.center(TOUCH ? 'TOCA PARA REINTENTAR' : 'PULSA ENTER PARA REINTENTAR', 100, COL.yellow, 1); }
      } else if (s === 'LEVEL_DONE') {
        this.marsBg(); const D = Level.def;
        R.center(D.done, 20, COL.yellow, D.done.length > 24 ? 1 : 2);
        const t = this.tally;
        [['BAJAS', t[0] + '%'], ['OBJETOS', t[1] + '%'], ['SECRETOS', t[2] + '%'], ['TIEMPO', this.fmtTime(t[3] * 35)], ['OBJETIVO', this.fmtTime(D.par * 35)]].forEach(([a, b], k) => { R.text(a, 80, 50 + k * 15, COL.red); R.text(b, 190, 50 + k * 15, COL.white); });
        R.center(D.next[0], 132, COL.gray); R.center(D.next[1], 142, COL.gray);
        R.center(Level.num + 1 < LEVELS.length ? 'SIGUIENTE: NIVEL ' + (Level.num + 2) + ' — ' + LEVELS[Level.num + 1].name : 'FIN DEL EPISODIO 1 — CONTINUARÁ', 158, COL.yellow);
        if (this.stateT > 35) R.center(TOUCH ? 'TOCA PARA CONTINUAR' : 'PULSA ENTER', 182, COL.white);
      }
    }
    R.present();
  },
  skull(x, y) { const g = new Img(12, 11); g.ell(6, 4, 5, 4, P(0, 13)); g.rect(3, 7, 6, 3, P(0, 12)); g.rect(3, 3, 2, 2, P(3, 3)); g.rect(7, 3, 2, 2, P(3, 3)); g.rect(5, 6, 2, 1, P(0, 4)); for (let k = 0; k < 3; k++) g.px(4 + k * 2, 9, P(0, 4)); Render.blit(g.outline(P(0, 1)), x, y, 31); },
  marsBg() { if (!this.mars) { const g = new Img(320, 200), n = valueNoise(21, 32); g.rect(0, 0, 320, 200, (x, y) => P(7, 1 + 6 * n(x / 30, y / 30) + 2 * n(x / 8, y / 8))); this.mars = g; } Render.blit(this.mars, 0, 0, 20); }
};

// ----- 14b. Autoprueba (?test=1) -----
function selfTest() {
  const out = [], ok = (id, c, msg) => out.push((c ? 'OK    ' : 'FALLA ') + id + ' ' + msg);
  ok('A5a', LV1_ROWS.length === 36 && LV1_ROWS.every(r => r.length === 64), 'nivel 1: mapa 64x36');
  ok('A5b', LV1_ENTS.length === 36, 'nivel 1: entidades base = ' + LV1_ENTS.length);
  // BFS genérico con progresión (llaves, interruptores, disparadores); devuelve el orden de eventos
  const progress = (k, noAcid) => {
    Level.load(k); const L = Level.def, st = L.ents.find(e => e[0] === 'JUGADOR'), s0 = st[2] * MW + st[1];
    const keys = new Set(), sw = new Set(), fired = new Set(), raised = new Set(), log = [];
    const fz = (i) => { const c = Level.ch[i]; if ('mnop'.includes(c)) return raised.has('stairs') ? { m: 12, n: 24, o: 36, p: 48 }[c] : 0; if (c === 'z') return raised.has('bridge') ? L.zTo : null; return Level.floor[i]; };
    const pass = (i) => { const c = Level.ch[i]; if (Level.solid[i]) return false; if (KEY_OF[c]) return keys.has(KEY_OF[c]); if (c === 'B') return sw.has('w'); if (c === 'b') return sw.has('v'); if (c === 'T' || c === 't') return false; if (noAcid && Level.acid[i]) return false; return fz(i) !== null; };
    const doTrig = (t) => { if (fired.has(t)) return; fired.add(t); for (const a of t.do) if (a[0] === 'raise') raised.add(a[1]); };
    for (let it = 0; it < 30; it++) {
      const seen = new Uint8Array(Level.N), q = [s0], touch = []; seen[s0] = 1;
      for (let h = 0; h < q.length; h++) { const c = q[h]; for (const o of [1, -1, MW, -MW]) { const n = c + o; if (seen[n]) continue; const ch = Level.ch[n]; if ('Swv'.includes(ch)) { touch.push(ch); continue; } if (!pass(n)) continue; if (fz(n) - fz(c) > CONFIG.STEP) continue; seen[n] = 1; q.push(n); } }
      let ch = false;
      for (const e of L.ents) if (e[0].startsWith('LLAVE_') && seen[e[2] * MW + e[1]]) { const k2 = { LLAVE_ROJA: 'red', LLAVE_AZUL: 'blue', LLAVE_AMARILLA: 'yellow' }[e[0]]; if (!keys.has(k2)) { keys.add(k2); log.push(k2); ch = true; for (const t of L.trig) if (t.on === 'pick' && t.item === e[0]) doTrig(t); } }
      for (const c of touch) if ('wv'.includes(c) && !sw.has(c)) { sw.add(c); log.push(c); ch = true; for (const t of L.trig) if (t.on === c) doTrig(t); }
      for (const t of L.trig) if (t.on === 'enter' && !fired.has(t)) { const [x0, y0, x1, y1] = t.rect; for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (seen[y * MW + x] && !fired.has(t)) { doTrig(t); log.push('zona'); ch = true; } }
      if (touch.includes('S')) { log.push('SALIDA'); break; }
      if (!ch) break;
    }
    return log;
  };
  const l1 = progress(0, true);
  ok('A6', l1.includes('SALIDA'), 'nivel 1: salida alcanzable sin pisar ácido');
  for (let k = 1; k < LEVELS.length; k++) {
    const log = progress(k, false);
    ok('A2' + k, log.includes('SALIDA') && log.length > 1, 'nivel ' + (k + 1) + ' ' + LEVELS[k].name + ': ' + log.join(' > '));
    ok('A3' + k, LEVELS[k].rows.length === 36 && LEVELS[k].rows.every(r => r.length === 64) && LEVELS[k].secret.length >= 1, 'nivel ' + (k + 1) + ': 64x36 y ' + LEVELS[k].secret.length + ' zona(s) secreta(s)');
  }
  ok('A18', CONFIG.LIGHT_FALLOFF === 96 && Tex.t.SWITCH_OFF.h === 128, 'valores V2 (luz 96, interruptor 64x128)');
  ok('TEX', ['WALL_PIPES', 'WALL_REACTOR', 'WALL_PANEL', 'WALL_GREEN', 'FLOOR_HEX', 'FLOOR_TILE', 'DOOR_RED', 'DOOR_BLUE', 'DOOR_YELLOW', 'DOOR_LOCK', 'DOOR_BARRIER', 'WSWITCH_OFF'].every(t => Tex.t[t]), 'texturas: ' + Object.keys(Tex.t).length);
  ok('SPR', ['BRUTO', 'W_AMETRA', 'LLAVE_AZUL', 'LLAVE_AMARILLA'].every(t => Spr.s[t]) && Spr.s.SOLDADO.length === 16 && Spr.s.W_AMETRA.length === 8 && Spr.s.FLASH.length === 3, 'sprites: frente + espalda, calor del arma, 3 fogonazos');
  const t0 = performance.now(); Level.load(0); Player.reset(2); Actors.reset(2); for (let k = 0; k < 10; k++) { Render.view(Player.x, Player.y, Player.ang + k * 0.6, Player.eyeZ(), 0); Render.sprites(Actors.list); }
  ok('A4', true, 'render medio ' + ((performance.now() - t0) / 10).toFixed(2) + ' ms/frame');
  Level.load(0); Player.reset(2); Actors.list = [];
  out.forEach(l => console.log('SELFTEST ' + l)); return out;
}

// ===== 16. BUCLE PRINCIPAL Y ARRANQUE =====
(function boot() {
  const cv = document.getElementById('screen'), ctx = cv.getContext('2d');
  Render.init(ctx); Tex.build(); Spr.build(); HUD.buildPanel(); Input.init(cv); Touch.init();
  Level.load(0); Stats.reset(); Player.reset(2); Weapons.reset(); Actors.list = [];
  if (/[?&]test=1/.test(location.search)) window.SELFTEST = selfTest();
  window.FOBOS = { Game, Player, Level, Actors, Weapons, Stats, Render, Doors, Input, CONFIG, LEVELS, Particles };
  let acc = 0, last = performance.now(), frames = 0, fpsT = last;
  function loop(now) {
    acc += Math.min(0.25, (now - last) / 1000); last = now;
    while (acc >= CONFIG.TIC) { Game.tick(); acc -= CONFIG.TIC; }
    Game.render(); frames++; if (now - fpsT >= 1000) { Game.fps = frames; frames = 0; fpsT = now; }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
